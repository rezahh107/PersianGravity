name: G006 Gravity Forms commit clean final tree

on:
  push:
    branches:
      - feat/g006-gravityforms-full-persian-coverage

permissions:
  contents: write

jobs:
  commit-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.8.12
          coverage: none

      - name: Restore and verify reviewed Gravity Forms source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown==5.2.0
          test "$(find .g006/v2 -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 24
          cat .g006/v2/part* > /tmp/gf-stage-payload.b64
          base64 -d /tmp/gf-stage-payload.b64 > /tmp/gf-stage-payload.tar.xz
          echo 'da1dd66445ea98e5a341a267e4f7bd0c6cd64e3601c850445c7499f8da63fb20  /tmp/gf-stage-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/gf-stage-payload.tar.xz -C .

          gdown 'https://drive.google.com/uc?id=1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy' -O /tmp/gravityforms.zip
          echo '542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  /tmp/gravityforms.zip' | sha256sum -c -
          rm -rf /tmp/gf-source
          unzip -q /tmp/gravityforms.zip -d /tmp/gf-source
          pot="$(find /tmp/gf-source -type f -path '*/languages/gravityforms.pot' -print -quit)"
          test -n "$pot"
          echo 'a4eb120ee9513552004400548c26a568612ace6accdf9fdcd60b8aa4b163bccf  '"$pot" | sha256sum -c -
          printf '%s\n' "$pot" > /tmp/gf-pot-path
          git show 83f2cbfb5425984ac6545a6075497606efd81508:languages/gravityforms/gravityforms-fa_IR.po > /tmp/legacy-gf.po

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.g006/finalize-v3.py')
          text = path.read_text(encoding='utf-8')
          old = r'\bAPI\b|\bURL\b|\bPHP\b'
          new = r'\bAPI\b|\bURLs?\b|\bPHP\b'
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .g006/finalize-v3.py > /tmp/gf-finalize.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/gf-finalize.json'))
          assert (d['canonical'],d['preexisting'],d['remainder'],d['stale_excluded']) == (4207,1759,2448,True)
          assert d['origins']=={'new':922,'corrected_legacy':741,'unchanged_legacy':785}
          assert d['second_pass_corrections']==1604
          assert d['baseline_keyset']=='e15f8e80cc711ea7b862be66d3a8a5827f85e0312caae391fcdecbf1a34fdec7'
          assert d['baseline_translation']=='a0b631dfcb88eb497be26086799a8816b7f85f99fd42c62afe6488ee508f9c27'
          PY

      - name: Apply proven URL literal regression fix and build artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          validator=Path('tools/i18n/content-admission.php')
          text=validator.read_text(encoding='utf-8')
          old=r'\bAPI\b|\bURL\b|\bPHP\b'
          new=r'\bAPI\b|\bURLs?\b|\bPHP\b'
          assert old in text
          text=text.replace(old,new,1)
          old_result="\t$result = $matches[0];\n\tsort( $result, SORT_STRING );"
          new_result="\t$result = array_map(\n\t\tstatic function ( $literal ) {\n\t\t\treturn 'URLs' === $literal ? 'URL' : $literal;\n\t\t},\n\t\t$matches[0]\n\t);\n\tsort( $result, SORT_STRING );"
          assert old_result in text
          validator.write_text(text.replace(old_result,new_result,1),encoding='utf-8')

          test_path=Path('tests/ContentAdmissionTokenSemanticsTest.php')
          test_text=test_path.read_text(encoding='utf-8')
          if 'test_pluralized_url_protected_literal_is_canonicalized' not in test_text:
              addition="\n\n    public function test_pluralized_url_protected_literal_is_canonicalized(): void {\n        $this->assertSame( array( 'URL' ), pgr_content_protected_literals( 'Links/URLs are not allowed.' ) );\n        $this->assertSame( array( 'URL' ), pgr_content_protected_literals( 'پیوندها/URLها مجاز نیستند.' ) );\n    }\n"
              idx=test_text.rfind('\n}')
              assert idx != -1
              test_path.write_text(test_text[:idx]+addition+test_text[idx:],encoding='utf-8')
          PY
          composer install --no-interaction --no-progress --prefer-dist
          composer i18n:build
          composer i18n:check

      - name: Commit only the clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g006
          rm -f \
            .github/workflows/gf-bootstrap.yml \
            .github/workflows/gf-history-po.yml \
            .github/workflows/gf-translation-draft.yml \
            .github/workflows/gf-fast-draft.yml \
            .github/workflows/gf-final-qualification.yml \
            .github/workflows/gf-apply-final.yml \
            .github/workflows/gf-apply-final-v3.yml \
            .github/workflows/gf-commit-clean-final.yml

          test ! -e .g006
          for f in \
            .github/workflows/gf-bootstrap.yml \
            .github/workflows/gf-history-po.yml \
            .github/workflows/gf-translation-draft.yml \
            .github/workflows/gf-fast-draft.yml \
            .github/workflows/gf-final-qualification.yml \
            .github/workflows/gf-apply-final.yml \
            .github/workflows/gf-apply-final-v3.yml \
            .github/workflows/gf-commit-clean-final.yml
          do
            test ! -e "$f"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^languages/providers/(gravityflow|gravityview)/' || true)"
          git diff --cached --check -- . \
            ':(exclude)languages/providers/gravityforms/gravityforms-fa_IR.l10n.php' \
            ':(exclude)languages/providers/gravityforms/source/fa_IR.po' \
            ':(exclude)languages/providers/gravityforms/source/records/remainder-fa_IR.po'
          git commit -m 'feat(i18n): complete Gravity Forms Persian coverage'
          git push origin HEAD:feat/g006-gravityforms-full-persian-coverage
