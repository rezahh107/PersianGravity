name: G006 GravityView Build Materialization

on:
  push:
    branches: [feat/g006-gravityview-full-persian-coverage]
    paths:
      - '.github/workflows/g006-gravityview-build-materialize.yml'
      - 'languages/providers/gravityview/**'
      - 'tools/i18n/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:2.8.12
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Materialize and verify deterministic provider artifacts
        run: |
          set -euo pipefail
          php tools/i18n/build.php --write
          php tools/i18n/build.php --check
          vendor/bin/phpunit --filter 'ContentAdmissionGeneralizationTest|GravityViewContentAdmissionTest|CrossProductContentAdmissionIntegrationTest|CatalogBuildTest'
      - name: Commit deterministic generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            languages/providers/gravityview/gravityview-fa_IR.mo \
            languages/providers/gravityview/gravityview-fa_IR.l10n.php \
            languages/providers/gravityview/metadata.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already match the admitted source authority."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(i18n): materialize GravityView provider artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g006-gravityview-generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            languages/providers/gravityview/gravityview-fa_IR.mo
            languages/providers/gravityview/gravityview-fa_IR.l10n.php
            languages/providers/gravityview/metadata.json
          if-no-files-found: error
          retention-days: 7
