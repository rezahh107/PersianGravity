name: G010 WU02 Validation Patch

on:
  push:
    branches:
      - feat/g010-wu02-compatibility-diagnostics
    paths:
      - '.g010-wu02-validation-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/g010-wu02-compatibility-diagnostics
          fetch-depth: 1
      - name: Record bounded WU02 validation evidence
        shell: bash
        run: |
          set -euo pipefail
          php tools/compatibility/apply-g010-wu02-validation-patch.php
          git diff --check
          test "$(git diff --name-only)" = 'docs/VALIDATION.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VALIDATION.md
          git commit -m 'docs: record WU02 diagnostics validation evidence'
          git push origin HEAD:feat/g010-wu02-compatibility-diagnostics
