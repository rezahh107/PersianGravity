name: Artifact Install Smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: persiangravity-artifact-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-artifact:
    name: Generated ZIP / WordPress 6.7.2 / PHP 8.2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      database:
        image: mariadb:11.4.8
        env:
          MARIADB_ROOT_PASSWORD: release-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -prelease-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout exact target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        id: source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          [[ "$observed" == "$EXPECTED_HEAD" ]] || {
            echo "Checkout mismatch: expected=$EXPECTED_HEAD observed=$observed" >&2
            exit 1
          }
          printf 'head=%s\n' "$observed" >> "$GITHUB_OUTPUT"

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          tools: wp-cli:2.12.0
          coverage: none

      - name: Verify release contracts and build production ZIP
        id: package
        shell: bash
        env:
          PGR_PACKAGE_SOURCE_SHA: ${{ steps.source.outputs.head }}
        run: |
          set -euo pipefail
          php tools/release/release-tool.php verify
          bash tests/release/contracts.sh
          bash tools/build-production-package.sh

      - name: Install and activate generated ZIP without Gravity Forms
        env:
          PGR_PACKAGE_ZIP: ${{ github.workspace }}/dist/${{ steps.package.outputs.zip_name }}
          PGR_PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PGR_PACKAGE_SOURCE_SHA: ${{ steps.package.outputs.source_head }}
          PGR_PACKAGE_SOURCE_TREE: ${{ steps.package.outputs.source_tree }}
          PGR_SMOKE_WP_VERSION: '6.7.2'
          PGR_SMOKE_DB_PASSWORD: release-root
          PGR_SMOKE_EVIDENCE: ${{ github.workspace }}/release-evidence/generated-smoke.txt
        run: bash tools/release/smoke-production-package.sh

      - name: Upload generated package smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-install-smoke-${{ steps.source.outputs.head }}
          path: |
            dist/${{ steps.package.outputs.zip_name }}
            dist/${{ steps.package.outputs.checksum_name }}
            release-evidence/generated-smoke.txt
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
