name: Temporary Gravity Flow finalizer

on:
  push:
    branches:
      - feat/gravityflow-classified-content-admission-v2
    paths:
      - .github/workflows/gravityflow-finalize-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Reconstruct and verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .pgr-transfer/part01.txt \
            .pgr-transfer/part02.txt \
            .pgr-transfer/part03.txt \
            .pgr-transfer/chunk{00..24}.txt \
            .pgr-transfer/part5.txt \
            > /tmp/pgr_payload.b64
          echo 'e4c108456590444fc08f82c27ada832f088f049a86ee1409ddaf75c9c176c3ca  /tmp/pgr_payload.b64' | sha256sum --check --strict
          base64 --decode /tmp/pgr_payload.b64 > /tmp/pgr_payload.tgz
          echo '9cd173158e7022c3086aee04e2726cbd7ddc4c3ba1b69ffaf73cbf8e20fbec1f  /tmp/pgr_payload.tgz' | sha256sum --check --strict
          tar -tzf /tmp/pgr_payload.tgz | grep -Ev '^\./(languages/providers/gravityflow/|tests/GravityFlow|tools/i18n/admission/)' && {
            echo 'Unexpected payload path' >&2
            exit 1
          } || true
          tar -xzf /tmp/pgr_payload.tgz -C "$GITHUB_WORKSPACE"

      - name: Allow accepted zero-message surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/i18n/content-admission.php')
          text = path.read_text()
          old = "! is_int( $record['admitted_message_count'] ?? null ) || 0 >= $record['admitted_message_count'] ||"
          new = "! is_int( $record['admitted_message_count'] ?? null ) || 0 > $record['admitted_message_count'] ||"
          if text.count(old) != 1:
              raise SystemExit('validator patch anchor drift')
          path.write_text(text.replace(old, new))
          PY

      - name: Install locked development dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist

      - name: Build and verify deterministic provider artifacts
        shell: bash
        run: |
          set -euo pipefail
          composer i18n:build
          echo 'bff3f53338558fd9c62e19a6dc8161f39c61a8cdb42d807acc1fe6693868fa1a  languages/providers/gravityflow/source/fa_IR.po' | sha256sum --check --strict
          echo '247224d3385df3fbbeda0bb2177d649858b808d10586b7ecac8da90a5424615c  languages/providers/gravityflow/gravityflow-fa_IR.mo' | sha256sum --check --strict
          echo '580e658d61be7190fb53db1fe7c9f1cf15ba5210ef8aa7fe8c4bf5432aa262d0  languages/providers/gravityflow/gravityflow-fa_IR.l10n.php' | sha256sum --check --strict
          echo '263590c8abd09c9c18d09755e160b28c0c26c58e0b29c2f02814a9359a8e2b74  languages/providers/gravityflow/metadata.json' | sha256sum --check --strict
          echo '1c3e610a8ee5c4e507b85ec89aff71158ac36921fd2515ee5c6339a470af7cdc  languages/providers/gravityflow/source/provenance.json' | sha256sum --check --strict
          echo 'c66a42a95c7ec08e9f2481c36f6710a7e53011f5d53b607727752f300a2b9d54  tools/i18n/admission/content.json' | sha256sum --check --strict
          test -z "$(find languages/providers/gravityflow -maxdepth 1 -type f -name 'gravityflow-fa_IR-*.json' -print -quit)"
          composer i18n:check

      - name: Run focused syntax, PHPUnit, and coding standards
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/i18n/content-admission.php
          php -l tests/GravityFlowInboxContentAdmissionTest.php
          php -l tests/GravityFlowStatusContentAdmissionTest.php
          php -l tests/GravityFlowClassifiedContentAdmissionTest.php
          composer test
          composer cs

      - name: Commit verified production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rezahh107'
          git config user.email '84147076+rezahh107@users.noreply.github.com'
          git add tools/i18n/content-admission.php tools/i18n/admission \
            languages/providers/gravityflow tests/GravityFlowInboxContentAdmissionTest.php \
            tests/GravityFlowStatusContentAdmissionTest.php tests/GravityFlowClassifiedContentAdmissionTest.php
          if git diff --cached --quiet; then
            echo 'No production changes to commit' >&2
            exit 1
          fi
          git commit -m 'feat: complete Gravity Flow classified content admission'
          git push origin HEAD:feat/gravityflow-classified-content-admission-v2
