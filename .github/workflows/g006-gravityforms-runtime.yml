name: G006 Gravity Forms Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g006-gravityforms-runtime.yml'
      - 'languages/providers/gravityforms/**'
      - 'languages/providers/gravityflow/**'
      - 'includes/localization/**'
      - 'tools/i18n/**'
      - 'tests/real-integration/g006-gravityforms-runtime.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-runtime:
    name: Exact GF 3.1.1.1 + Flow 3.1.0
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: g006-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pg006-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      G006_GF_WP_PATH: /tmp/g006-gf-wordpress
      G006_GF_PACKAGE_DIR: /tmp/g006-gf-packages
      G006_GF_ARTIFACT_DIR: /tmp/g006-gf-artifacts
      G006_GF_WP_CLI: /tmp/wp-cli.phar
      G006_GF_GF_FILE_ID: 1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy
      G006_GF_GF_FILE: gravityforms-3.1.1.1-source-package.zip
      G006_GF_GF_SIZE: '5300290'
      G006_GF_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      G006_GF_GF_VERSION: 3.1.1.1
      G006_GF_FLOW_FILE_ID: 1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf
      G006_GF_FLOW_FILE: gravityflow-3.1.0-owner-supplied-source-package.zip
      G006_GF_FLOW_SIZE: '2603034'
      G006_GF_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      G006_GF_FLOW_VERSION: 3.1.0

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert Head and set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.33'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12

      - name: Validate harness and repository boundary
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          composer validate --strict
          bash -n tests/real-integration/verify-package.sh
          php -l tests/real-integration/g006-gravityforms-runtime.php
          test -z "$(git ls-files '*.zip')"
          mkdir -p "$G006_GF_WP_PATH" "$G006_GF_PACKAGE_DIR" "$G006_GF_ARTIFACT_DIR"

      - name: Install disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 -o "$G006_GF_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $G006_GF_WP_CLI" | sha256sum -c -
          php "$G006_GF_WP_CLI" core download --path="$G006_GF_WP_PATH" --version=6.8.3 --force --skip-content
          php "$G006_GF_WP_CLI" config create --path="$G006_GF_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=g006-root --dbhost=127.0.0.1:3306 --skip-check
          php "$G006_GF_WP_CLI" core install --path="$G006_GF_WP_PATH" --url=http://127.0.0.1:8080 --title='G006 GF Runtime' --admin_user=runtime_admin --admin_password='g006-runtime-only' --admin_email='runtime@example.invalid' --skip-email
          php "$G006_GF_WP_CLI" language core install fa_IR --activate --path="$G006_GF_WP_PATH"
          test "$(php "$G006_GF_WP_CLI" option get WPLANG --path="$G006_GF_WP_PATH")" = "fa_IR"

      - name: Download and verify exact licensed packages
        shell: bash
        run: |
          set -euo pipefail
          download() {
            curl -L --fail --retry 4 --retry-delay 2 --retry-max-time 60 --retry-connrefused --connect-timeout 20 --max-time 180 -o "$2" "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"
          }
          download "$G006_GF_GF_FILE_ID" "$G006_GF_PACKAGE_DIR/$G006_GF_GF_FILE"
          download "$G006_GF_FLOW_FILE_ID" "$G006_GF_PACKAGE_DIR/$G006_GF_FLOW_FILE"

          evidence="$G006_GF_ARTIFACT_DIR/package-verification.jsonl"
          : > "$evidence"
          tests/real-integration/verify-package.sh "Gravity Forms" "$G006_GF_GF_FILE_ID" "$G006_GF_PACKAGE_DIR/$G006_GF_GF_FILE" "$G006_GF_GF_FILE" "$G006_GF_GF_SIZE" "$G006_GF_GF_SHA256" "gravityforms/gravityforms.php" "$G006_GF_GF_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "Gravity Flow" "$G006_GF_FLOW_FILE_ID" "$G006_GF_PACKAGE_DIR/$G006_GF_FLOW_FILE" "$G006_GF_FLOW_FILE" "$G006_GF_FLOW_SIZE" "$G006_GF_FLOW_SHA256" "gravityflow/gravityflow.php" "$G006_GF_FLOW_VERSION" "$evidence"
          test "$(wc -l < "$evidence")" -eq 2

          unzip -q "$G006_GF_PACKAGE_DIR/$G006_GF_GF_FILE" -d "$G006_GF_WP_PATH/wp-content/plugins"
          unzip -q "$G006_GF_PACKAGE_DIR/$G006_GF_FLOW_FILE" -d "$G006_GF_WP_PATH/wp-content/plugins"

      - name: Install PR Head and execute real host runtime assertions
        shell: bash
        run: |
          set -euo pipefail
          pgr="$G006_GF_WP_PATH/wp-content/plugins/persian-gravityforms"
          mkdir -p "$pgr"
          tar --exclude=.git -cf - . | tar -xf - -C "$pgr"
          php "$G006_GF_WP_CLI" plugin activate persian-gravityforms gravityforms gravityflow --path="$G006_GF_WP_PATH"
          test "$(php "$G006_GF_WP_CLI" plugin get gravityforms --field=version --path="$G006_GF_WP_PATH")" = "$G006_GF_GF_VERSION"
          test "$(php "$G006_GF_WP_CLI" plugin get gravityflow --field=version --path="$G006_GF_WP_PATH")" = "$G006_GF_FLOW_VERSION"
          test "$(php "$G006_GF_WP_CLI" plugin get persian-gravityforms --field=version --path="$G006_GF_WP_PATH")" = "4.4.0"
          G006_GF_ARTIFACT_DIR="$G006_GF_ARTIFACT_DIR" php "$G006_GF_WP_CLI" --path="$G006_GF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/real-integration/g006-gravityforms-runtime.php"
          test -s "$G006_GF_ARTIFACT_DIR/g006-gravityforms-runtime.json"

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g006-gravityforms-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/g006-gf-artifacts
          if-no-files-found: ignore
          retention-days: 30
