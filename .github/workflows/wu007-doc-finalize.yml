name: WU007 Documentation Finalize

on:
  push:
    branches:
      - feat/wu007-cross-product-runtime-hardening

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/wu007-cross-product-runtime-hardening
      - name: Record integrated hardening evidence and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/VALIDATION.md')
          text = path.read_text()
          marker = 'This file distinguishes source evidence from real WordPress/Gravity Forms browser evidence.'
          evidence = '''WU-007 cross-product integrated hardening evidence on 2026-09-14: no production runtime defect was found. The production manifest validates exactly 19 accepted records (Gravity Forms 6 / Gravity Flow 7 / GravityView 6) with deterministic unions 1759 / 732 / 461 and non-admitted counts 2448 / 366 / 2666. All three product script maps remain empty; `gk-query-filters` and `action-scheduler` remain unmanaged dependency domains. WordPress Core production-provider validation now exercises committed PHP/MO artifacts for all three products: admitted identities resolve from PersianGravity, representative non-admitted identities preserve upstream fallback in both PHP and MO formats and source-English fallback with upstream absent, six cross-domain contamination checks pass, and both excluded dependency domains remain unmanaged. The Core run passed 97 general localization checks plus 25 production-provider checks. A clean checkout ran `composer i18n:build` with zero tracked or untracked drift, followed by `composer i18n:check`; PHPUnit passed 130 tests / 1464 assertions on PHP 8.3 in that clean-build gate. Licensed WordPress/product browser surfaces and RTL presentation remain `NOT_PROVEN` here and belong to WU-008.\n\n'''
          if evidence.strip() not in text:
              if marker not in text:
                  raise SystemExit('validation marker not found')
              text = text.replace(marker, evidence + marker, 1)
              path.write_text(text)
          PY
          rm .github/workflows/wu007-doc-finalize.yml
          git config user.name "rezahh107"
          git config user.email "84147076+rezahh107@users.noreply.github.com"
          git add docs/VALIDATION.md .github/workflows/wu007-doc-finalize.yml
          git diff --cached --check
          git commit -m "docs: record WU007 integrated hardening evidence"
          git push origin HEAD:feat/wu007-cross-product-runtime-hardening
