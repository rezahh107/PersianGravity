name: WU006 Docs Finalize

on:
  push:
    branches:
      - feat/wu006-gravityview-classified-content-admission
    paths:
      - '.github/workflows/wu006-docs-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize active WU006 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = "GravityView `3.3.4` در لایهٔ source admission با `source_status=PACKAGE_INSPECTED_METADATA_ONLY` و package SHA-256 `af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829` ثبت شده است؛ `project_source_authority=OWNER_SUPPLIED_EXACT_PACKAGE` و `vendor_authenticity=NOT_PROVEN` است و چون vendor POT در بسته وجود ندارد `vendor_pot_sha256=null` باقی می‌ماند. census اصلی `gk-gravityview` شامل `3127` identity canonical، `127` contextual، `42` plural و `3931` source reference است. WU-006 اکنون دقیقاً یک content admission محدود برای `gravityview::frontend_runtime::shortcode:gravityview` اضافه می‌کند: فقط `2` identity ثابت از مسیر `src/Shortcode/GravityViewShortcode.php`. ترجمه‌های این دو identity بدون بازنویسی از baseline نهایی WU-002 با SHA-256 `2f57d0e1878801f30f6f9c1c8d354c68a739e8364cea063cdb7a56a8f81a2fca` می‌آیند؛ baseline کامل `3281` identity مرورشده دارد و مجوز admission سراسری نیست. `gk-query-filters` مرز dependency/domain جداگانه باقی می‌ماند و PersianGravity آن را manifest یا runtime-activate نمی‌کند. GravityView شش surface source-backed دارد و مجموع registry فعلی `19` surface است: 6 Gravity Forms + 7 Gravity Flow + 6 GravityView. برای surface پذیرفته‌شدهٔ GravityView، provider MO و `.l10n.php` فقط از همان دو پیام تولید می‌شوند، script map خالی می‌ماند، `0` native JS handle فعال است و هیچ translation JSON تولید نمی‌شود. identityهای admit‌نشده fallback موجود upstream/vendor/TranslationsPress و سپس متن منبع را حفظ می‌کنند. evidence مربوط به RTL/BiDi فقط source-based است و real licensed browser/UI validation همچنان `NOT_RUN` است. این وضعیت فقط bounded `CONTENT_ADMITTED_PARTIAL` است و ادعای ترجمهٔ کامل GravityView، محصول کامل یا اکوسیستم کامل نیست."
          new = "GravityView `3.3.4` در لایهٔ source admission با `source_status=PACKAGE_INSPECTED_METADATA_ONLY` و package SHA-256 `af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829` ثبت شده است؛ `project_source_authority=OWNER_SUPPLIED_EXACT_PACKAGE` و `vendor_authenticity=NOT_PROVEN` است و چون vendor POT در بسته وجود ندارد `vendor_pot_sha256=null` باقی می‌ماند. census اصلی `gk-gravityview` شامل `3127` identity canonical، `127` contextual، `42` plural و `3931` source reference است. Content Admission v2 اکنون هر شش surface پذیرفته‌شدهٔ GravityView را مستقل پوشش می‌دهد: frontend shortcode (`2`)، Gutenberg View block (`1`)، Admin Builder (`340`)، Foundation Settings (`41`)، Entry Approval (`30`) و Search Widget (`53`). مجموع occurrenceها `467` است و overlapهای یکسان به union قطعی `461` identity می‌رسند؛ `2666` identity از source census همچنان unclassified/non-admitted هستند و fallback موجود را حفظ می‌کنند. ترجمه‌ها از authority مرورشدهٔ WU-003 آمده‌اند و baseline تاریخی shortcode دوپیامی WU-002 بدون تغییر حفظ شده است. `gk-query-filters` مرز dependency/domain جداگانه باقی می‌ماند و PersianGravity آن را manifest یا runtime-activate نمی‌کند. مجموع registry فعلی `19` surface است: 6 Gravity Forms + 7 Gravity Flow + 6 GravityView. provider MO و `.l10n.php` فقط از union معتبر `461` identity ساخته می‌شوند، script map خالی می‌ماند، `0` native JS handle فعال است و هیچ translation JSON برای GravityView تولید نمی‌شود. evidence مربوط به RTL/BiDi فقط source-based است و real licensed browser/UI validation همچنان `NOT_RUN` است. این وضعیت bounded `CONTENT_ADMITTED_PARTIAL` است و ادعای ترجمهٔ کامل GravityView، محصول کامل یا اکوسیستم کامل نیست."
          if old not in text:
              raise SystemExit('README GravityView current-state paragraph not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          wp_readme = Path('readme.txt')
          text = wp_readme.read_text(encoding='utf-8')
          old = "GravityView 3.3.4 is source-admitted at `PACKAGE_INSPECTED_METADATA_ONLY` from the exact owner-supplied package SHA-256 `af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829`; `project_source_authority=OWNER_SUPPLIED_EXACT_PACKAGE`, `vendor_authenticity=NOT_PROVEN`, and the exact package contains no vendor POT so `vendor_pot_sha256=null`. Its primary `gk-gravityview` census is 3127 canonical identities, including 127 contextual and 42 plural identities, with 3931 source references. WU-006 adds exactly one bounded GravityView content-admission record for `gravityview::frontend_runtime::shortcode:gravityview`, containing only two canonical identities proven by `src/Shortcode/GravityViewShortcode.php`. Their Persian text is copied unchanged from the final WU-002 reviewed baseline SHA-256 `2f57d0e1878801f30f6f9c1c8d354c68a739e8364cea063cdb7a56a8f81a2fca`; that full baseline contains 3281 reviewed canonical identities and does not grant blanket content authority. `gk-query-filters` remains a separate bounded Composer dependency/domain that PersianGravity does not manifest or runtime-activate. GravityView contributes six source-backed surfaces, making the current registry 19 total: 6 Gravity Forms + 7 Gravity Flow + 6 GravityView. For the admitted GravityView surface, the provider MO and `.l10n.php` are generated only from the two-message aggregate, the product script map remains empty, zero native JS translation handles are activated, and no GravityView translation JSON is generated. Non-admitted identities retain the existing upstream/vendor/TranslationsPress/source-English fallback. This is bounded `CONTENT_ADMITTED_PARTIAL`, not full-product or browser-complete localization; RTL/BiDi evidence is source-only and real licensed GravityView browser/UI validation remains `NOT_RUN`."
          new = "GravityView 3.3.4 is source-admitted at `PACKAGE_INSPECTED_METADATA_ONLY` from the exact owner-supplied package SHA-256 `af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829`; `project_source_authority=OWNER_SUPPLIED_EXACT_PACKAGE`, `vendor_authenticity=NOT_PROVEN`, and the exact package contains no vendor POT so `vendor_pot_sha256=null`. Its primary `gk-gravityview` census is 3127 canonical identities, including 127 contextual and 42 plural identities, with 3931 source references. Content Admission v2 now independently admits all six accepted GravityView surfaces: frontend shortcode (2), Gutenberg View block (1), Admin Builder (340), Foundation Settings (41), Entry Approval (30), and Search Widget (53). Their 467 surface occurrences deterministically deduplicate to 461 unique admitted identities; 2666 source identities remain unclassified/non-admitted and retain the existing fallback chain. The reviewed WU-003 authority supplies the admitted translations while the historical two-message WU-002 shortcode baseline remains unchanged. `gk-query-filters` remains a separate bounded Composer dependency/domain that PersianGravity does not manifest or runtime-activate. GravityView contributes six source-backed surfaces, making the current registry 19 total: 6 Gravity Forms + 7 Gravity Flow + 6 GravityView. Provider MO and `.l10n.php` are generated only from the validated 461-identity union, the product script map remains empty, zero native JS translation handles are activated, and no GravityView translation JSON is generated. This is bounded `CONTENT_ADMITTED_PARTIAL`, not full-product or browser-complete localization; RTL/BiDi evidence is source-only and real licensed GravityView browser/UI validation remains `NOT_RUN`."
          if old not in text:
              raise SystemExit('readme GravityView current-state paragraph not found')
          text = text.replace(old, new, 1)
          old_changelog = "* Admitted exactly the first bounded GravityView 3.3.4 frontend shortcode content surface: two source-proven `gk-gravityview` identities copied unchanged from the final WU-002 reviewed baseline, deterministic MO/`.l10n.php`, zero JS handles/translation JSON, preserved fallback for all non-admitted identities, and no licensed browser-validation claim."
          new_changelog = "* Completed GravityView 3.3.4 Content Admission v2 across all six accepted surfaces: 467 surface occurrences, 461 unique admitted identities, 2666 unclassified/non-admitted source identities, deterministic MO/`.l10n.php`, zero JS handles/translation JSON, preserved two-message shortcode baseline, and no licensed browser-validation claim."
          if old_changelog not in text:
              raise SystemExit('readme GravityView changelog line not found')
          wp_readme.write_text(text.replace(old_changelog, new_changelog, 1), encoding='utf-8')

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          start = text.index('GravityView production content authority is revision 2 with exactly one independently')
          end = text.index('\n\nGravity Forms production content authority', start)
          replacement = "GravityView production content authority is revision 2 with all six accepted Surface Registry records independently validated: frontend shortcode 2, Gutenberg View block 1, Admin Builder 340, Foundation Settings 41, Entry Approval 30, and Search Widget 53. The records contain 467 surface occurrences with identical overlaps deduplicated to a deterministic 461-identity aggregate from the separate 3127-message source census; 2666 source identities remain unclassified/non-admitted. The reviewed WU-003 translation authority is bounded by these source-backed records, while the historical two-identity WU-002 shortcode record and translations remain unchanged. `gk-query-filters` remains outside the manifested/runtime-activated provider boundary. GravityView script handles remain zero and no GravityView translation JSON is generated. Non-admitted identities keep the existing upstream/vendor/TranslationsPress fallback and then source English. RTL/BiDi evidence remains source-only and real licensed GravityView browser/UI validation is `NOT_RUN`. This is bounded `CONTENT_ADMITTED_PARTIAL`, not full-product localization."
          architecture.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          validation = Path('docs/VALIDATION.md')
          text = validation.read_text(encoding='utf-8')
          anchor = "- Gravity Flow native JS handles: 0; generated translation JSON: 0.\n"
          insertion = (
              "- GravityView: revision 2, 6 admitted records with surface counts 2 / 1 / 340 / 41 / 30 / 53; 467 occurrences deduplicate to 461 unique admitted identities from a 3127-identity source census; 2666 remain unclassified/non-admitted.\n"
              "- GravityView native JS handles: 0; generated translation JSON: 0; the historical two-identity frontend-shortcode admission remains byte/translation-fingerprint locked.\n"
          )
          if anchor not in text:
              raise SystemExit('VALIDATION current snapshot anchor not found')
          text = text.replace(anchor, anchor + insertion, 1)
          marker = "This file distinguishes source evidence from real WordPress/Gravity Forms browser evidence.\n"
          evidence = (
              "\nWU-006 GravityView classified Content Admission v2 source evidence on 2026-09-14: exact GravityView 3.3.4 package SHA-256 `af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829` was reverified; the reviewed authority input was byte-verified before header-only GNU-gettext canonicalization; repository-native content validation reproduced all six surface fingerprints and the 461-identity aggregate; `composer i18n:build` and `composer i18n:check` passed deterministically; PHP syntax, `composer test`, `composer cs`, `composer compat`, Structured Scanner Node tests, runtime-integrity guards, zero-JS/no-JSON checks and protected-boundary diffs passed before the production commit. No real licensed GravityView browser/UI scenario was executed, so browser/runtime presentation remains `NOT_PROVEN`.\n\n"
          )
          if marker not in text:
              raise SystemExit('VALIDATION introduction marker not found')
          validation.write_text(text.replace(marker, evidence + marker, 1), encoding='utf-8')
          PY

          git rm -r --ignore-unmatch .github/scripts/__pycache__
          git rm .github/workflows/wu006-docs-finalize.yml
          git diff --check
          ! grep -q 'exactly one independently' docs/ARCHITECTURE.md
          ! grep -q 'WU-006 adds exactly one bounded GravityView' readme.txt
          ! grep -q 'WU-006 اکنون دقیقاً یک content admission' README.md
          grep -q '461 unique admitted identities' readme.txt
          grep -q '461-identity aggregate' docs/VALIDATION.md

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rezahh107'
          git config user.email '84147076+rezahh107@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs: synchronize GravityView content admission v2'
          git push origin HEAD:feat/wu006-gravityview-classified-content-admission
