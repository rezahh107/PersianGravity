name: Bounded Gravity Flow Changelog HTTP Investigation
on:
  push:
    branches:
      - investigation/flow-changelog-http-20261025
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe official changelog ordinary versus cache revalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, html, json, re, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone
          
          URL = "https://docs.gravityflow.io/changelog/"
          UA = "Mozilla/5.0 (compatible; PersianGravity-Upstream-Radar/1.0; +https://github.com/rezahh107/PersianGravity)"
          BASE_HEADERS = {"User-Agent": UA, "Accept": "text/html,application/rss+xml,application/xml;q=0.9,*/*;q=0.1", "Accept-Encoding": "identity"}
          SELECTED = ("date", "age", "cache-control", "etag", "last-modified", "expires", "vary", "via", "server", "x-cache", "x-cache-hits", "x-served-by", "cf-cache-status", "cf-ray", "x-litespeed-cache", "location")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def fetch(mode):
              current = URL
              hops = []
              request_headers = dict(BASE_HEADERS)
              if mode == "revalidate":
                  request_headers.update({"Cache-Control":"no-cache", "Pragma":"no-cache"})
              for hop in range(6):
                  parsed = urllib.parse.urlparse(current)
                  if parsed.scheme != "https" or parsed.hostname != "docs.gravityflow.io":
                      raise ValueError("Unexpected redirect host/scheme: " + current)
                  req = urllib.request.Request(current, headers=request_headers, method="GET")
                  try:
                      response = opener.open(req, timeout=25)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      status = response.status
                      headers = {key.lower():value for key, value in response.headers.items()}
                      hops.append({"url":current,"status":status,"headers":{key:headers[key] for key in SELECTED if key in headers}})
                      if 300 <= status < 400:
                          location = response.headers.get("Location")
                          if not location:
                              raise ValueError("Redirect without Location")
                          current = urllib.parse.urljoin(current, location)
                          continue
                      raw = response.read(8 * 1024 * 1024 + 1)
                      if len(raw) > 8*1024*1024:
                          raise ValueError("HTTP response exceeds 8 MiB")
                      headings = []
                      for value in re.findall(rb"<h[1-6]\b[^>]*>.*?</h[1-6]>", raw, flags=re.I|re.S):
                          txt = html.unescape(re.sub(r"<[^>]*>", "", value.decode("utf-8","replace")))
                          txt = " ".join(txt.split())
                          match = re.match(r"^([0-9]+(?:\.[0-9]+){2,3})(?![0-9.])",txt)
                          if match:
                              headings.append(txt[:160])
                          if len(headings) >= 8:
                              break
                      return {"mode":mode,"hops":hops,"status":status,"body_bytes":len(raw),"sha256":hashlib.sha256(raw).hexdigest(),"release_headings":headings}
              raise ValueError("Too many redirects")
          out={"schema_version":1,"probe_url":URL,"samples":[]}
          for index in range(8):
              mode = "ordinary" if index % 2 == 0 else "revalidate"
              sampled_at = datetime.now(timezone.utc).isoformat()
              try:
                  result = fetch(mode)
                  result["sampled_at"] = sampled_at
                  print(index,mode,result["status"],result["sha256"],result["release_headings"][:2],result["hops"][-1]["headers"],flush=True)
              except Exception as exc:
                  result={"mode":mode,"sampled_at":sampled_at,"error":str(exc)}
                  print(index,mode,"ERROR",str(exc),flush=True)
              out["samples"].append(result)
              time.sleep(1)
          with open("flow-http-probes.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
              f.write("\n")
          
          PY
      - name: Preserve raw observation metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-http-probes
          path: flow-http-probes.json
          if-no-files-found: warn
          retention-days: 7
