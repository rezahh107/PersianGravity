name: G006 Gravity Forms apply reviewed closure v3

on:
  push:
    branches:
      - feat/g006-gravityforms-full-persian-coverage

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .g006/v2 -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 24
          cat .g006/v2/part* > /tmp/gf-stage-payload.b64
          base64 -d /tmp/gf-stage-payload.b64 > /tmp/gf-stage-payload.tar.xz
          echo 'da1dd66445ea98e5a341a267e4f7bd0c6cd64e3601c850445c7499f8da63fb20  /tmp/gf-stage-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/gf-stage-payload.tar.xz -C .
          test -f .g006/finalize-v3.py

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.8.12
          coverage: none

      - name: Install qualification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gettext
          python3 -m pip install --quiet gdown==5.2.0

      - name: Verify exact Gravity Forms authority and reconstruct reviewed 4207 catalog
        shell: bash
        run: |
          set -euo pipefail
          gdown 'https://drive.google.com/uc?id=1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy' -O /tmp/gravityforms.zip
          echo '542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  /tmp/gravityforms.zip' | sha256sum -c -
          rm -rf /tmp/gf-source
          unzip -q /tmp/gravityforms.zip -d /tmp/gf-source
          pot="$(find /tmp/gf-source -type f -path '*/languages/gravityforms.pot' -print -quit)"
          test -n "$pot"
          echo 'a4eb120ee9513552004400548c26a568612ace6accdf9fdcd60b8aa4b163bccf  '"$pot" | sha256sum -c -
          printf '%s\n' "$pot" > /tmp/gf-pot-path
          gf_root="$(dirname "$(dirname "$pot")")"
          test ! -e "$gf_root/tests/playwright/mu-plugins/snippets/gform_settings_header_buttons.php"
          git show 83f2cbfb5425984ac6545a6075497606efd81508:languages/gravityforms/gravityforms-fa_IR.po > /tmp/legacy-gf.po
          python3 .g006/finalize-v3.py | tee /tmp/gf-finalize.json
          python3 - <<'PY'
          import json, pathlib
          d=json.loads(pathlib.Path('/tmp/gf-finalize.json').read_text())
          assert d['canonical']==4207
          assert d['preexisting']==1759
          assert d['remainder']==2448
          assert d['stale_excluded'] is True
          assert d['origins']=={'new':922,'corrected_legacy':741,'unchanged_legacy':785}
          assert d['second_pass_corrections']==1604
          assert d['baseline_keyset']=='e15f8e80cc711ea7b862be66d3a8a5827f85e0312caae391fcdecbf1a34fdec7'
          assert d['baseline_translation']=='a0b631dfcb88eb497be26086799a8816b7f85f99fd42c62afe6488ee508f9c27'
          PY

      - name: Validate Composer contract and install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          php -r '$d=json_decode(file_get_contents("composer.lock"),true); foreach (array_merge($d["packages"]??[], $d["packages-dev"]??[]) as $p) {if (($p["name"]??"")==="gettext/gettext") {$v=ltrim((string)($p["version"]??""),"v"); if ($v!=="5.7.3") exit(2); echo "gettext/gettext 5.7.3\n"; exit(0);}} exit(3);'

      - name: Build, GNU gettext validate, and prove deterministic output
        shell: bash
        run: |
          set -euo pipefail
          composer i18n:build
          msgfmt --check --check-format -o /tmp/gf-rem.mo languages/providers/gravityforms/source/records/remainder-fa_IR.po
          msgfmt --check --check-format -o /tmp/gf-agg.mo languages/providers/gravityforms/source/fa_IR.po
          php -l tools/i18n/content-admission.php
          php -l tests/real-integration/g006-gravityforms-runtime.php
          php -l tests/i18n/run-production.php
          find languages/providers/gravityforms -maxdepth 1 -type f \( -name '*.php' -o -name '*.json' -o -name '*.mo' \) -print0 | sort -z | xargs -0 sha256sum > /tmp/build-one.sha256
          composer i18n:build
          find languages/providers/gravityforms -maxdepth 1 -type f \( -name '*.php' -o -name '*.json' -o -name '*.mo' \) -print0 | sort -z | xargs -0 sha256sum > /tmp/build-two.sha256
          diff -u /tmp/build-one.sha256 /tmp/build-two.sha256
          composer i18n:check

      - name: Run repository test and compatibility suites
        shell: bash
        run: |
          set -euo pipefail
          composer test
          composer cs
          composer compat
          node --test tests/js/structured-scanner.test.js

      - name: Check current WordPress localization contracts
        uses: actions/checkout@v7
        with:
          repository: WordPress/WordPress
          ref: b998fef9238af183f9523b3df71618e6e57498b6
          path: .wordpress-core-current
          persist-credentials: false
      - name: Run current WordPress localization contracts
        run: composer i18n:test
        env:
          PGR_WP_CORE: ${{ github.workspace }}/.wordpress-core-current

      - name: Check minimum WordPress localization contracts
        uses: actions/checkout@v7
        with:
          repository: WordPress/WordPress
          ref: 6abb46bec8b58abba32602738a785ba1c83f2a1c
          path: .wordpress-core-min
          persist-credentials: false
      - name: Run minimum WordPress localization contracts
        run: composer i18n:test
        env:
          PGR_WP_CORE: ${{ github.workspace }}/.wordpress-core-min

      - name: Prove final GF full authority and cross-product preservation
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $gf=json_decode(file_get_contents("languages/providers/gravityforms/metadata.json"),true);
            $flow=json_decode(file_get_contents("languages/providers/gravityflow/metadata.json"),true);
            foreach ([["gf",$gf,4207],["flow",$flow,1098]] as [$n,$d,$count]) {
              if (($d["authoritative_total"]??null)!==$count || ($d["counts_in_committed_po"]??null)!==$count || ($d["content_status"]??null)!=="FULL_TRANSLATION_CONTENT_ACCEPTED") {fwrite(STDERR,"bad $n full metadata\n"); exit(1);}
            }
            if (($gf["js_translation_handles"]??null)!==0 || ($flow["js_translation_handles"]??null)!==0) exit(1);
          '
          test -z "$(find languages/providers/gravityforms -maxdepth 1 -type f -name '*.json' ! -name 'metadata.json' -print -quit)"
          git diff --exit-code origin/main -- languages/providers/gravityflow
          git diff --exit-code origin/main -- languages/providers/gravityview
          python3 - <<'PY'
          import json
          r=json.load(open('tools/i18n/admission/reviews/gravityforms-remainder.json'))
          e=json.load(open('tools/i18n/admission/remainders/gravityforms.json'))
          assert (r['accepted_count'],r['unreviewed_count'],r['rejected_count'],r['semantic_review_passes'],r['second_pass_corrections']) == (2448,0,0,2,1604)
          assert e['canonical_message_count']==4207 and e['preexisting_accepted_message_count']==1759 and e['remainder_message_count']==2448
          assert e['canonical_keyset_sha256']=='1b92edc87f2d152cb98a026dde815ab93e3e8303eef2954e95b3a816a85801fb'
          assert '2b64a903d2065499fa0248c6199db150bb7d1a43025d2908e8a66e4af9d4ab92' not in {x['identity'] for x in e['entries']}
          PY

      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g006 .wordpress-core-current .wordpress-core-min
          rm -f \
            .github/workflows/gf-bootstrap.yml \
            .github/workflows/gf-history-po.yml \
            .github/workflows/gf-translation-draft.yml \
            .github/workflows/gf-fast-draft.yml \
            .github/workflows/gf-final-qualification.yml \
            .github/workflows/gf-apply-final.yml \
            .github/workflows/gf-apply-final-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git diff --cached --name-only | grep -E '^languages/providers/(gravityflow|gravityview)/' || true)"
          test -z "$(git diff --cached --name-only | grep -E '^\.g006/|^\.github/workflows/gf-(bootstrap|history-po|translation-draft|fast-draft|final-qualification|apply-final|apply-final-v3)\.yml$' || true)"
          git diff --cached --check
          git commit -m 'feat(i18n): complete Gravity Forms Persian coverage'
          git push origin HEAD:feat/g006-gravityforms-full-persian-coverage
