name: Scanner Editor Remediation Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'includes/fields/class-gf-field-structured-scanner.php'
      - 'tests/ScannerFieldCompatibilityTest.php'
      - 'tests/real-integration/scanner-editor-remediation*'
      - '.github/workflows/scanner-editor-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-editor-browser:
    name: GF 3.1.1.1 Form Builder remediation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: scanner-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pscanner-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGR_SCANNER_WP_PATH: /tmp/pgr-scanner-wordpress
      PGR_SCANNER_PACKAGE_DIR: /tmp/pgr-scanner-packages
      PGR_SCANNER_ARTIFACT_DIR: /tmp/pgr-scanner-artifacts
      PGR_SCANNER_BASE_URL: http://127.0.0.1:8080
      PGR_SCANNER_WP_CLI: /tmp/wp-cli.phar
      PGR_ROLLBACK_PRIVATE_DIR: /tmp/pgr-scanner-private-rollback
      PGR_REMEDIATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PGR_GF_FILE_ID: 1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy
      PGR_GF_FILE: gravityforms-3.1.1.1-source-package.zip
      PGR_GF_SIZE: '5300290'
      PGR_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      PGR_GF_VERSION: 3.1.1.1

    steps:
      - name: Checkout remediation harness head exactly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert harness identity and prepare isolated paths
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/PersianGravity"
          test "$(git rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          rm -rf "$PGR_SCANNER_WP_PATH" "$PGR_SCANNER_PACKAGE_DIR" "$PGR_SCANNER_ARTIFACT_DIR"
          mkdir -p "$PGR_SCANNER_WP_PATH" "$PGR_SCANNER_PACKAGE_DIR" "$PGR_SCANNER_ARTIFACT_DIR"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          printf 'PGR_SCANNER_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"

      - name: Set up PHP 8.2 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli

      - name: Validate focused browser harness
        shell: bash
        run: |
          set -euo pipefail
          php tools/ci/check-php82-runtime.php
          printf 'Scanner editor PHP: %s (stable 8.2.x)\n' "$(php -r 'echo PHP_VERSION;')" >> "$GITHUB_STEP_SUMMARY"
          php -l tests/real-integration/scanner-editor-remediation-setup.php
          php -l tests/real-integration/scanner-editor-remediation-observer.php
          php -l tests/rollback-rehearsal/scanner-matched-version.php
          node --check tests/real-integration/scanner-editor-remediation.mjs
          bash -n tests/real-integration/verify-package.sh

      - name: Install exact WP-CLI and disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 -o "$PGR_SCANNER_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $PGR_SCANNER_WP_CLI" | sha256sum -c -
          php "$PGR_SCANNER_WP_CLI" core download --path="$PGR_SCANNER_WP_PATH" --version=6.8.3 --force --skip-content
          php "$PGR_SCANNER_WP_CLI" config create --path="$PGR_SCANNER_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=scanner-root --dbhost=127.0.0.1:3306 --skip-check
          php "$PGR_SCANNER_WP_CLI" core install --path="$PGR_SCANNER_WP_PATH" --url="$PGR_SCANNER_BASE_URL" --title='Scanner Remediation' --admin_user=runtime_admin --admin_password="$PGR_SCANNER_ADMIN_PASSWORD" --admin_email='runtime@example.invalid' --skip-email
          php "$PGR_SCANNER_WP_CLI" option update home "$PGR_SCANNER_BASE_URL" --path="$PGR_SCANNER_WP_PATH"
          php "$PGR_SCANNER_WP_CLI" option update siteurl "$PGR_SCANNER_BASE_URL" --path="$PGR_SCANNER_WP_PATH"
          test "$(php "$PGR_SCANNER_WP_CLI" option get home --path="$PGR_SCANNER_WP_PATH")" = "$PGR_SCANNER_BASE_URL"
          test "$(php "$PGR_SCANNER_WP_CLI" option get siteurl --path="$PGR_SCANNER_WP_PATH")" = "$PGR_SCANNER_BASE_URL"
          test "$(php "$PGR_SCANNER_WP_CLI" core version --path="$PGR_SCANNER_WP_PATH")" = "6.8.3"
          php "$PGR_SCANNER_WP_CLI" language core install fa_IR --activate --path="$PGR_SCANNER_WP_PATH"
          test "$(php "$PGR_SCANNER_WP_CLI" option get WPLANG --path="$PGR_SCANNER_WP_PATH")" = "fa_IR"

      - name: Download and fail-closed verify Gravity Forms 3.1.1.1
        shell: bash
        run: |
          set -euo pipefail
          zip="$PGR_SCANNER_PACKAGE_DIR/$PGR_GF_FILE"
          curl -L --fail --retry 4 --retry-delay 2 --retry-max-time 60 --retry-connrefused --connect-timeout 20 --max-time 180 \
            -o "$zip" "https://drive.usercontent.google.com/download?id=${PGR_GF_FILE_ID}&export=download&confirm=t"
          tests/real-integration/verify-package.sh \
            "Gravity Forms" "$PGR_GF_FILE_ID" "$zip" "$PGR_GF_FILE" "$PGR_GF_SIZE" "$PGR_GF_SHA256" \
            "gravityforms/gravityforms.php" "$PGR_GF_VERSION" "$PGR_SCANNER_ARTIFACT_DIR/package-verification.jsonl"

      - name: Install exact Gravity Forms and exact remediation Head
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "$PGR_SCANNER_PACKAGE_DIR/$PGR_GF_FILE" -d "$PGR_SCANNER_WP_PATH/wp-content/plugins"
          pgr="$PGR_SCANNER_WP_PATH/wp-content/plugins/persian-gravityforms"
          git init "$pgr"
          git -C "$pgr" remote add origin https://github.com/rezahh107/PersianGravity.git
          git -C "$pgr" fetch --depth=1 origin "$PGR_REMEDIATION_SHA"
          git -C "$pgr" checkout --detach FETCH_HEAD
          test "$(git -C "$pgr" rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          printf '%s\n' "$PGR_REMEDIATION_SHA" > "$PGR_SCANNER_ARTIFACT_DIR/installed-persiangravity-sha.txt"
          mkdir -p "$PGR_SCANNER_WP_PATH/wp-content/mu-plugins"
          cp tests/real-integration/scanner-editor-remediation-observer.php "$PGR_SCANNER_WP_PATH/wp-content/mu-plugins/pgr-scanner-remediation-observer.php"
          php "$PGR_SCANNER_WP_CLI" plugin activate gravityforms persian-gravityforms --path="$PGR_SCANNER_WP_PATH"
          test "$(php "$PGR_SCANNER_WP_CLI" plugin get gravityforms --field=version --path="$PGR_SCANNER_WP_PATH")" = "$PGR_GF_VERSION"
          test "$(git -C "$pgr" rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"

      - name: Create deterministic Structured Scanner Form Builder fixture
        shell: bash
        run: |
          set -euo pipefail
          php "$PGR_SCANNER_WP_CLI" --path="$PGR_SCANNER_WP_PATH" eval-file tests/real-integration/scanner-editor-remediation-setup.php
          test -s "$PGR_SCANNER_ARTIFACT_DIR/runtime-manifest.json"
          php -r '$m=json_decode(file_get_contents(getenv("PGR_SCANNER_ARTIFACT_DIR")."/runtime-manifest.json"),true); if(($m["remediation_sha_installed"]??"")!==getenv("PGR_REMEDIATION_SHA") || ($m["gravityforms_version"]??"")!=="3.1.1.1" || ($m["locale"]??"")!=="fa_IR") exit(1);'

      - name: Set up exact Node and Chromium runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"

      - name: Start disposable WordPress server
        shell: bash
        run: |
          set -euo pipefail
          php "$PGR_SCANNER_WP_CLI" server --path="$PGR_SCANNER_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/pgr-scanner-wp-server.log 2>&1 &
          echo $! >/tmp/pgr-scanner-wp-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$PGR_SCANNER_BASE_URL/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pgr-scanner-wp-server.log >&2
          exit 1

      - name: Execute real Gravity Forms Form Builder Chromium proof
        id: browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/scanner-editor-remediation.mjs

      - name: Capture authentic read-only Scanner UI in both WordPress locales
        id: scanner_ui
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/real-integration/scanner-ui-readonly-fixture.php
          node --check tests/real-integration/scanner-ui-readonly-browser.mjs
          export WU008_WP_PATH="$PGR_SCANNER_WP_PATH"
          export WU008_ARTIFACT_DIR="$PGR_SCANNER_ARTIFACT_DIR"
          export WU008_MANIFEST_PATH="$PGR_SCANNER_ARTIFACT_DIR/runtime-manifest.json"
          export WU008_PGR_SHA="$PGR_REMEDIATION_SHA"
          export WU008_ADMIN_PASSWORD="$PGR_SCANNER_ADMIN_PASSWORD"
          php "$PGR_SCANNER_WP_CLI" --path="$PGR_SCANNER_WP_PATH" eval-file tests/real-integration/admin-ui-evidence-fixture.php
          php "$PGR_SCANNER_WP_CLI" --path="$PGR_SCANNER_WP_PATH" eval-file tests/real-integration/scanner-ui-readonly-fixture.php
          restore_locale() {
            php "$PGR_SCANNER_WP_CLI" option update WPLANG fa_IR --path="$PGR_SCANNER_WP_PATH"
          }
          trap restore_locale EXIT
          WU008_SCANNER_AUDIT_LOCALE=fa_IR node tests/real-integration/scanner-ui-readonly-browser.mjs
          php "$PGR_SCANNER_WP_CLI" option delete WPLANG --path="$PGR_SCANNER_WP_PATH"
          test "$(php "$PGR_SCANNER_WP_CLI" --path="$PGR_SCANNER_WP_PATH" eval 'echo get_locale();')" = "en_US"
          WU008_SCANNER_AUDIT_LOCALE=en_US node tests/real-integration/scanner-ui-readonly-browser.mjs
          restore_locale
          trap - EXIT
          test -s "$PGR_SCANNER_ARTIFACT_DIR/scanner-ui-qualification-evidence/CONTACT_SHEET.md"

      - name: Rehearse real v4.10.0 matched-binary Registry rollback (disposable only)
        id: matched_rollback
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/PersianGravity"
          test "$(git rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          test -f "$PGR_SCANNER_ARTIFACT_DIR/runtime-manifest.json"
          mkdir -m 700 "$PGR_ROLLBACK_PRIVATE_DIR"
          zip="$PGR_SCANNER_PACKAGE_DIR/persian-gravityforms-4.10.0.zip"
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 \
            -o "$zip" "https://github.com/rezahh107/PersianGravity/releases/download/v4.10.0/persian-gravityforms-4.10.0.zip"
          echo "8d7a61d77f9ef7f59ac39336767a65f125c36df01f85ae7854fe7b80fa1d9f91  $zip" | sha256sum -c -
          unzip -p "$zip" persian-gravityforms/release-manifest.json | php -r '
            $m = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
            if (($m["version"] ?? "") !== "4.10.0" ||
                ($m["source_commit"] ?? "") !== "97b9fedb4b8d2743ce645c60a8a467fac0de6e76") exit(1);
          '
          pgr="$PGR_SCANNER_WP_PATH/wp-content/plugins/persian-gravityforms"
          test "$(git -C "$pgr" rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          candidate="$PGR_SCANNER_PACKAGE_DIR/candidate-source"
          historical="$PGR_SCANNER_PACKAGE_DIR/historical-source"
          old_main_sha="$(unzip -p "$zip" persian-gravityforms/persian-gravityforms.php | sha256sum | cut -d ' ' -f1)"
          phase() {
            PGR_ROLLBACK_PHASE="$1" php "$PGR_SCANNER_WP_CLI" --path="$PGR_SCANNER_WP_PATH" \
              eval-file tests/rollback-rehearsal/scanner-matched-version.php
          }
          # Seed via real release code, not a synthetic hand-built v1 option.
          mv "$pgr" "$candidate"
          unzip -q "$zip" -d "$PGR_SCANNER_WP_PATH/wp-content/plugins"
          test "$(sha256sum "$pgr/persian-gravityforms.php" | cut -d ' ' -f1)" = "$old_main_sha"
          phase seed_legacy
          mv "$pgr" "$historical"
          mv "$candidate" "$pgr"
          test "$(git -C "$pgr" rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          phase migrate_and_change
          # Restore verified v1 bytes before ever re-loading the old plugin.
          phase restore_backup
          mv "$pgr" "$candidate"
          mv "$historical" "$pgr"
          test "$(sha256sum "$pgr/persian-gravityforms.php" | cut -d ' ' -f1)" = "$old_main_sha"
          phase verify_legacy
          mv "$pgr" "$historical"
          mv "$candidate" "$pgr"
          test "$(git -C "$pgr" rev-parse HEAD)" = "$PGR_REMEDIATION_SHA"
          test -s "$PGR_SCANNER_ARTIFACT_DIR/matched-version-rollback-report.json"
          printf 'Matched historical v4.10.0 plugin/backup rollback: PASS (disposable only)\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Hash remediation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$PGR_SCANNER_ARTIFACT_DIR"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload remediation browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scanner-editor-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/pgr-scanner-artifacts
            /tmp/pgr-scanner-wp-server.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce browser proof after artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "browser outcome: ${{ steps.browser.outcome }}"
          test "${{ steps.browser.outcome }}" = "success"
          echo "matched rollback outcome: ${{ steps.matched_rollback.outcome }}"
          test "${{ steps.matched_rollback.outcome }}" = "success"

  publish-scanner-ui:
    name: Publish independent exact-Head Scanner UI screenshots
    needs: scanner-editor-browser
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download read-only evidence as untrusted data
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: scanner-editor-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/scanner-ui-downloaded
      - name: Validate screenshots, exact source identity and scenario geometry
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'PGR_SCANNER_UI_GATE'
          import fs from 'node:fs'; import path from 'node:path';
          const dir='/tmp/scanner-ui-downloaded/pgr-scanner-artifacts/scanner-ui-qualification-evidence';
          const check=(v,m)=>{if(!v)throw Error('SCANNER_UI_GATE: '+m);};
          const names=new Set(['fixture.json','CONTACT_SHEET.md','manifest-fa_IR.json','manifest-en_US.json']);
          for(const l of ['fa_IR','en_US'])for(const w of [1280,390,320]){
            for(const s of ['list','create','edit','built-in','builder'])
              names.add('scanner-ui-'+l+'-'+s+'-'+w+'.png');
            for(const s of ['grid-one-column','preview-css-control'])
              names.add('scanner-ui-'+l+'-builder-'+s+'-'+w+'.png');
          }
          const actual=fs.readdirSync(dir);
          check(actual.length===names.size,'missing or extra files');
          for(const file of actual){
            const full=path.join(dir,file),s=fs.lstatSync(full);
            check(names.has(file)&&s.isFile()&&!s.isSymbolicLink()&&s.size>0&&s.size<8*1024*1024,
              'unexpected file '+file);
            if(file.endsWith('.png')){
              const b=fs.readFileSync(full),w=Number(file.match(/-(1280|390|320)\.png$/)[1]);
              check(b.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])) &&
                b.readUInt32BE(16)>=w&&b.readUInt32BE(20)>=700,'invalid or cropped PNG '+file);
            }
          }
          const f=JSON.parse(fs.readFileSync(path.join(dir,'fixture.json'),'utf8'));
          check(f.source_commit_installed===process.env.EXPECTED&&f.output_count===7&&f.form_id>0,
            'fixture identity');
          for(const l of ['fa_IR','en_US']){
            const m=JSON.parse(fs.readFileSync(path.join(dir,'manifest-'+l+'.json'),'utf8'));
            check(m.exact_test_head===process.env.EXPECTED&&m.installed_package===process.env.EXPECTED&&
              m.locale===l&&m.no_form_submission===true&&m.no_registry_mutation_by_observer===true&&
              m.cases.length===15,'runtime identity or missing scenarios');
            for(const x of m.cases){
              check(x.status==='CAPTURED_UNREVIEWED'&&names.has(x.screenshot)&&
                x.before.page.fontsReady==='loaded','unverified browser result');
              if(x.state==='builder')check(x.plugin_css_proof?.identical===true&&
                x.one_variable?.screenshot&&x.preview_stylesheet_control?.screenshot,
                'missing independent CSS controls');
            }
          }
          check(fs.readFileSync(path.join(dir,'CONTACT_SHEET.md'),'utf8').includes('Gravity Forms 3.1.1.1'),
            'no contact sheet');
          console.log('SCANNER_UI_PUBLICATION_GATE PASS: 42 original PNGs and 2 manifests');
          PGR_SCANNER_UI_GATE
      - name: Publish to fresh no-overwrite evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/scanner-ui-public && cd /tmp/scanner-ui-public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          branch="evidence/scanner-ui-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "Evidence branch already exists" >&2; exit 1
          fi
          git checkout --orphan "$branch"
          mkdir -p scanner-ui-qualification-evidence
          cp -a /tmp/scanner-ui-downloaded/pgr-scanner-artifacts/scanner-ui-qualification-evidence/. scanner-ui-qualification-evidence/
          git add -- scanner-ui-qualification-evidence
          git commit -m "evidence: exact-Head Scanner UI ${GITHUB_RUN_ID}"
          commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"
          observed="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$observed" = "$commit"
          echo "Exact source evidence SHA: $commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Contact sheet: https://github.com/${GITHUB_REPOSITORY}/blob/$commit/scanner-ui-qualification-evidence/CONTACT_SHEET.md" >> "$GITHUB_STEP_SUMMARY"
