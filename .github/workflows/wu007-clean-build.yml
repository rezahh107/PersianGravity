name: WU007 Clean Build

on:
  push:
    branches:
      - feat/wu007-cross-product-runtime-hardening

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install locked development dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
      - name: Verify canonical build is a clean no-op
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          composer i18n:build
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          composer i18n:check
      - name: Run integrated PHPUnit suite
        run: composer test
