          test -s "$WU008_ARTIFACT_DIR/g008-residual-adversarial-state-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-entry-detail-candidate-browser-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-schedule-browser-enabled.json"

      - name: Qualify Entry Detail candidate, schedule, Timeline and Print with module disabled
        shell: bash
        env:
          WU008_G008_MODE: disabled
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", false );'
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-residual-adversarial-state.php
          node tests/real-integration/g008-entry-detail-candidate-browser.mjs
          node tests/real-integration/g008-flow-schedule-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-residual-adversarial-state-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-entry-detail-candidate-browser-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-schedule-browser-disabled.json"
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", true );'

      - name: Prove English non-Persian workflow-info keeps ASCII digit presentation
        shell: bash
        env:
          WU008_G008_MODE: english
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", true );'
          php "$WU008_WP_CLI" option delete WPLANG --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo determine_locale();')" = "en_US"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "ltr"
          node tests/real-integration/g008-entry-detail-candidate-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-entry-detail-candidate-browser-english.json"
          test -s "$WU008_ARTIFACT_DIR/g008-timeline-production-hook-english.json"

      - name: Restore Persian locale after English Entry Detail control
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" option update WPLANG fa_IR --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo determine_locale();')" = "fa_IR"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "rtl"

      - name: Reconcile Entry Detail two-hook candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-entry-detail-candidate-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-entry-detail-two-hook-prototype.json"
          test -s "$WU008_ARTIFACT_DIR/g008-entry-detail-admission.json"

      - name: Reconcile authentic schedule branch qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-flow-schedule-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-schedule-qualification.json"

      - name: Reconcile multi-note Timeline and Print qualification
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-timeline-print-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-timeline-print-qualification.json"

      - name: Reconcile residual G008 evidence
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-flow-residual-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-residual-no-admission.json"

      - name: Reconcile committed qualification claims with exact-run evidence
        shell: bash
        run: |
          set -euo pipefail
