name: WU008 Licensed Real Integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wu008-real-integration.yml'
      - 'tests/real-integration/**'
      - 'tests/EcosystemFoundationRegistryTest.php'
      - 'tools/compatibility/**'
      - 'tools/jalali/**'
      - 'tools/build-production-package.sh'
      - 'tools/release/**'
      - 'includes/class-pgr-gravity-perks-rtl.php'
      - 'includes/class-pgr-gregorian-jalali-converter.php'
      - 'includes/class-pgr-jalali-presentation.php'
      - 'includes/class-pgr-gf-jalali-presentation-adapter.php'
      - 'includes/class-pgr-gravity-flow-inbox-jalali-presentation-adapter.php'
      - 'includes/class-pgr-gravity-flow-status-jalali-presentation-adapter.php'
      - 'includes/class-pgr-gravity-flow-entry-detail-jalali-presentation-adapter.php'
      - 'includes/class-pgr-gravity-flow-entry-detail-persian-digits-presentation-adapter.php'
      - 'includes/class-pgr-gravity-flow-timeline-jalali-presentation-adapter.php'
      - 'assets/js/pgr-flow-entry-detail-persian-digits.js'
      - 'docs/WU008_REAL_INTEGRATION.md'
      - 'docs/G009_RTL_BIDI_COMPATIBILITY.md'
      - 'docs/G008_JALALI_PRESENTATION.md'
      - 'docs/G008_SYSTEM_DATE_EXPANSION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-integration:
    name: Exact current Head + locked Gravity ecosystem packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: wu008-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pwu008-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WU008_WP_PATH: /tmp/wu008-wordpress
      WU008_PACKAGE_DIR: /tmp/wu008-packages
      WU008_ARTIFACT_DIR: /tmp/wu008-artifacts
      WU008_MANIFEST_PATH: /tmp/wu008-artifacts/runtime-manifest.json
      WU008_BASE_URL: http://127.0.0.1:8080
      WU008_WP_CLI: /tmp/wp-cli.phar

      WU008_GF_FILE_ID: 1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy
      WU008_GF_FILE: gravityforms-3.1.1.1-source-package.zip
      WU008_GF_SIZE: '5300290'
      WU008_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      WU008_GF_VERSION: 3.1.1.1

      WU008_FLOW_FILE_ID: 1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf
      WU008_FLOW_FILE: gravityflow-3.1.0-owner-supplied-source-package.zip
      WU008_FLOW_SIZE: '2603034'
      WU008_FLOW_SHA256: ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404
      WU008_FLOW_VERSION: 3.1.0

      WU008_VIEW_FILE_ID: 16gDLYvZyA0SYvNl44d2O1n5C9nxFbkm1
      WU008_VIEW_FILE: gravityview-3.3.4-source-package.zip
      WU008_VIEW_SIZE: '7569755'
      WU008_VIEW_SHA256: af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829
      WU008_VIEW_VERSION: 3.3.4

      WU008_PERKS_FILE_ID: 1s6bh8rcc-fGZcPWe2OzJQj48r7zaqeRG
      WU008_PERKS_FILE: gravityperks_2.3.16.zip
      WU008_PERKS_SIZE: '156703'
      WU008_PERKS_SHA256: a160d166fb7894b0dfc558ae92e0c230a1336ed2a81e78fa1216be72b1024e7c
      WU008_PERKS_VERSION: 2.3.16

      WU008_FUP_FILE_ID: 1W7rVScg5N0X8_RWyWrc95NU2bUf_boWQ
      WU008_FUP_FILE: gp-file-upload-pro-1.5.13.zip
      WU008_FUP_SIZE: '3503920'
      WU008_FUP_SHA256: fdab5621dc0c1b9d33384696f554ef9ac0d646a70f8cee652a1bc05c43f8f7ce
      WU008_FUP_VERSION: 1.5.13

      WU008_ADVS_FILE_ID: 1_if3Eb9MctTgQaeYhGlSsyOsIJPIfJZ5
      WU008_ADVS_FILE: gp-advanced-select-1.1.21.zip
      WU008_ADVS_SIZE: '184531'
      WU008_ADVS_SHA256: d83424bfac712e73d772e54e8740b828c52b7c118cfa9aac71646233a6fdcca2
      WU008_ADVS_VERSION: 1.1.21

    steps:
      - name: Checkout harness and PersianGravity source exactly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert current-Head identity and prepare isolated paths
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rezahh107/PersianGravity"
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          tree="$(git rev-parse HEAD^{tree})"
          printf 'WU008_PGR_SHA=%s\nWU008_PGR_TREE=%s\n' "$actual" "$tree" >> "$GITHUB_ENV"
          mkdir -p "$WU008_WP_PATH" "$WU008_PACKAGE_DIR" "$WU008_ARTIFACT_DIR"
          : > "$WU008_ARTIFACT_DIR/package-verification.jsonl"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$admin_password"
          printf 'WU008_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2.34'
          coverage: none
          extensions: mysqli
          tools: composer:2.8.12

      - name: Validate harness and repository invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "8.2.34"
          composer validate --strict
          bash -n tests/real-integration/verify-package.sh
          php -l tests/real-integration/setup-runtime.php
          php -l tests/real-integration/g009-setup-runtime.php
          php -l tests/real-integration/g008-flow-inbox-setup-runtime.php
          php -l tests/real-integration/g008-flow-inbox-state.php
          php -l tests/real-integration/g008-flow-status-state.php
          php -l tests/real-integration/g008-flow-residual-adversarial-setup.php
          php -l tests/real-integration/g008-flow-residual-adversarial-state.php
          php -l tests/real-integration/g008-flow-schedule-setup.php
          node --check tests/real-integration/browser-diagnostics.mjs
          node --check tests/real-integration/browser-tests.mjs
          node --check tests/real-integration/source-discovery.mjs
          node --check tests/real-integration/g008-residual-source-probe.mjs
          node --check tests/real-integration/g009-browser.mjs
          node --check tests/real-integration/g009-perks-source-probe.mjs
          node --check tests/real-integration/g008-flow-inbox-browser.mjs
          node --check tests/real-integration/g008-flow-inbox-reconcile.mjs
          node --check tests/real-integration/g008-flow-status-browser.mjs
          node --check tests/real-integration/g008-flow-status-reconcile.mjs
          node --check tests/real-integration/g008-flow-residual-browser.mjs
          node --check tests/real-integration/g008-entry-detail-candidate-browser.mjs
          node --check tests/real-integration/g008-entry-detail-candidate-reconcile.mjs
          node --check assets/js/pgr-flow-entry-detail-persian-digits.js
          node --check tests/real-integration/g008-flow-schedule-browser.mjs
          node --check tests/real-integration/g008-flow-schedule-reconcile.mjs
          node --check tests/real-integration/g008-timeline-print-reconcile.mjs
          node --check tests/real-integration/g008-flow-residual-reconcile.mjs
          node --check tests/real-integration/reconcile-qualification-evidence.mjs
          node --test tests/real-integration/browser-diagnostics.test.mjs
          node --test tests/js/flow-workflow-info-persian-digits.test.js
          node --test tests/real-integration/qualification-reconciliation.test.mjs
          if git ls-files '*.zip' | grep -q .; then
            echo "Licensed ZIP archives must never be committed." >&2
            exit 1
          fi

      - name: Build and bind installable PersianGravity package from exact current Head
        id: pgr_package
        shell: bash
        env:
          PGR_PACKAGE_SOURCE_SHA: ${{ env.WU008_PGR_SHA }}
          PGR_PACKAGE_OUTPUT_FILE: ${{ github.output }}
        run: |
          set -euo pipefail
          PGR_PACKAGE_OUTPUT_FILE="$GITHUB_OUTPUT" bash tools/build-production-package.sh

      - name: Export current-Head PersianGravity package identity
        shell: bash
        env:
          PGR_VERSION: ${{ steps.pgr_package.outputs.version }}
          PGR_ZIP_NAME: ${{ steps.pgr_package.outputs.zip_name }}
          PGR_ZIP_SHA: ${{ steps.pgr_package.outputs.zip_sha }}
          PGR_SOURCE_HEAD: ${{ steps.pgr_package.outputs.source_head }}
          PGR_SOURCE_TREE: ${{ steps.pgr_package.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$PGR_SOURCE_HEAD" = "$WU008_PGR_SHA"
          test "$PGR_SOURCE_TREE" = "$WU008_PGR_TREE"
          test -n "$PGR_VERSION"
          test -n "$PGR_ZIP_NAME"
          test -f "dist/$PGR_ZIP_NAME"
          echo "$PGR_ZIP_SHA  dist/$PGR_ZIP_NAME" | sha256sum -c -
          printf 'WU008_PGR_VERSION=%s\nWU008_PGR_ZIP_NAME=%s\nWU008_PGR_PACKAGE_SHA256=%s\n' \
            "$PGR_VERSION" "$PGR_ZIP_NAME" "$PGR_ZIP_SHA" >> "$GITHUB_ENV"

      - name: Install exact WP-CLI and disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 -o "$WU008_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $WU008_WP_CLI" | sha256sum -c -
          php "$WU008_WP_CLI" core download --path="$WU008_WP_PATH" --version=6.8.3 --force --skip-content
          php "$WU008_WP_CLI" config create --path="$WU008_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=wu008-root --dbhost=127.0.0.1:3306 --skip-check
          php "$WU008_WP_CLI" core install --path="$WU008_WP_PATH" --url="$WU008_BASE_URL" --title='WU008 Real Integration' --admin_user=runtime_admin --admin_password="$WU008_ADMIN_PASSWORD" --admin_email='runtime@example.invalid' --skip-email
          php "$WU008_WP_CLI" option update home "$WU008_BASE_URL" --path="$WU008_WP_PATH"
          php "$WU008_WP_CLI" option update siteurl "$WU008_BASE_URL" --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" option get home --path="$WU008_WP_PATH")" = "$WU008_BASE_URL"
          test "$(php "$WU008_WP_CLI" option get siteurl --path="$WU008_WP_PATH")" = "$WU008_BASE_URL"
          test "$(php "$WU008_WP_CLI" core version --path="$WU008_WP_PATH")" = "6.8.3"
          php "$WU008_WP_CLI" language core install fa_IR --activate --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" option get WPLANG --path="$WU008_WP_PATH")" = "fa_IR"

      - name: Install deterministic test theme
        shell: bash
        run: |
          set -euo pipefail
          theme="$WU008_WP_PATH/wp-content/themes/wu008-runtime"
          mkdir -p "$theme"
          cat > "$theme/style.css" <<'CSS'
          /*
          Theme Name: WU008 Runtime
          Version: 1.0.0
          */
          CSS
          cat > "$theme/index.php" <<'PHP'
          <?php
          ?><!doctype html>
          <html <?php language_attributes(); ?>>
          <head>
            <meta charset="<?php bloginfo( 'charset' ); ?>">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <?php wp_head(); ?>
          </head>
          <body <?php body_class(); ?>>
          <main><?php while ( have_posts() ) : the_post(); the_content(); endwhile; ?></main>
          <?php wp_footer(); ?>
          </body>
          </html>
          PHP
          php "$WU008_WP_CLI" theme activate wu008-runtime --path="$WU008_WP_PATH"

      - name: Download exact public Drive packages
        shell: bash
        run: |
          set -euo pipefail
          download() {
            local file_id="$1" output="$2"
            curl -L --fail --retry 4 --retry-delay 2 --retry-max-time 60 --retry-connrefused --connect-timeout 20 --max-time 180 \
              -o "$output" "https://drive.usercontent.google.com/download?id=${file_id}&export=download&confirm=t"
          }
          download "$WU008_GF_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_GF_FILE"
          download "$WU008_FLOW_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_FLOW_FILE"
          download "$WU008_VIEW_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_VIEW_FILE"
          download "$WU008_PERKS_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_PERKS_FILE"
          download "$WU008_FUP_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_FUP_FILE"
          download "$WU008_ADVS_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_ADVS_FILE"

      - name: Fail-closed verify all licensed packages before installation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$WU008_ARTIFACT_DIR/package-verification.jsonl"
          tests/real-integration/verify-package.sh "Gravity Forms" "$WU008_GF_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_GF_FILE" "$WU008_GF_FILE" "$WU008_GF_SIZE" "$WU008_GF_SHA256" "gravityforms/gravityforms.php" "$WU008_GF_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "Gravity Flow" "$WU008_FLOW_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_FLOW_FILE" "$WU008_FLOW_FILE" "$WU008_FLOW_SIZE" "$WU008_FLOW_SHA256" "gravityflow/gravityflow.php" "$WU008_FLOW_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "GravityView" "$WU008_VIEW_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_VIEW_FILE" "$WU008_VIEW_FILE" "$WU008_VIEW_SIZE" "$WU008_VIEW_SHA256" "gravityview/gravityview.php" "$WU008_VIEW_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "Gravity Perks" "$WU008_PERKS_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_PERKS_FILE" "$WU008_PERKS_FILE" "$WU008_PERKS_SIZE" "$WU008_PERKS_SHA256" "gravityperks/gravityperks.php" "$WU008_PERKS_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "GP File Upload Pro" "$WU008_FUP_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_FUP_FILE" "$WU008_FUP_FILE" "$WU008_FUP_SIZE" "$WU008_FUP_SHA256" "gp-file-upload-pro/gp-file-upload-pro.php" "$WU008_FUP_VERSION" "$evidence"
          tests/real-integration/verify-package.sh "GP Advanced Select" "$WU008_ADVS_FILE_ID" "$WU008_PACKAGE_DIR/$WU008_ADVS_FILE" "$WU008_ADVS_FILE" "$WU008_ADVS_SIZE" "$WU008_ADVS_SHA256" "gp-advanced-select/gp-advanced-select.php" "$WU008_ADVS_VERSION" "$evidence"
          test "$(wc -l < "$evidence")" -eq 6

      - name: Install verified vendors and exact current-Head PersianGravity package
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "$WU008_PACKAGE_DIR/$WU008_GF_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "$WU008_PACKAGE_DIR/$WU008_FLOW_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "$WU008_PACKAGE_DIR/$WU008_VIEW_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "$WU008_PACKAGE_DIR/$WU008_PERKS_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "$WU008_PACKAGE_DIR/$WU008_FUP_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "$WU008_PACKAGE_DIR/$WU008_ADVS_FILE" -d "$WU008_WP_PATH/wp-content/plugins"
          unzip -q "dist/$WU008_PGR_ZIP_NAME" -d "$WU008_WP_PATH/wp-content/plugins"

          manifest="$WU008_WP_PATH/wp-content/plugins/persian-gravityforms/release-manifest.json"
          test -f "$manifest"
          test "$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $m["source_commit"];' "$manifest")" = "$WU008_PGR_SHA"
          test "$(php -r '$m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR); echo $m["source_tree"];' "$manifest")" = "$WU008_PGR_TREE"

          php "$WU008_WP_CLI" plugin activate gravityforms --path="$WU008_WP_PATH"
          php "$WU008_WP_CLI" plugin activate gravityperks gp-file-upload-pro gp-advanced-select --path="$WU008_WP_PATH"
          php "$WU008_WP_CLI" plugin activate persian-gravityforms gravityflow gravityview --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" plugin get gravityforms --field=version --path="$WU008_WP_PATH")" = "$WU008_GF_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityflow --field=version --path="$WU008_WP_PATH")" = "$WU008_FLOW_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityview --field=version --path="$WU008_WP_PATH")" = "$WU008_VIEW_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityperks --field=version --path="$WU008_WP_PATH")" = "$WU008_PERKS_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gp-file-upload-pro --field=version --path="$WU008_WP_PATH")" = "$WU008_FUP_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gp-advanced-select --field=version --path="$WU008_WP_PATH")" = "$WU008_ADVS_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get persian-gravityforms --field=version --path="$WU008_WP_PATH")" = "$WU008_PGR_VERSION"

      - name: Discover exact vendor source seams without mutating vendors
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/source-discovery.mjs
          node tests/real-integration/g008-gravityview-source-probe.mjs
          node tests/real-integration/g008-residual-source-probe.mjs
          node tests/real-integration/g009-perks-source-probe.mjs
          test -s "$WU008_ARTIFACT_DIR/source-discovery.json"
          test -s "$WU008_ARTIFACT_DIR/g008-gravityview-source-qualification.json"
          test -s "$WU008_ARTIFACT_DIR/g008-residual-source-probe.json"
          test -s "$WU008_ARTIFACT_DIR/g009-perks-source-probe.json"

      - name: Create deterministic runtime fixtures and assert provider/fallback semantics
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/setup-runtime.php
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g009-setup-runtime.php
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-gravityview-setup-runtime.php
          test -s "$WU008_MANIFEST_PATH"
          test -s "$WU008_ARTIFACT_DIR/g008-gravityview-fixture.json"

      - name: Set up exact browser runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install exact Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.19.0"
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "const p=require('playwright/package.json'); if(p.version!=='1.55.0') process.exit(1);"

      - name: Start disposable WordPress HTTP server
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" server --path="$WU008_WP_PATH" --host=127.0.0.1 --port=8080 >/tmp/wu008-wp-server.log 2>&1 &
          echo $! >/tmp/wu008-wp-server.pid
          for i in $(seq 1 30); do
            if curl -fsS "$WU008_BASE_URL/" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wu008-wp-server.log >&2
          exit 1

      - name: Execute existing WU008 provider/fallback regression on current Head
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/browser-tests.mjs

      - name: Execute current-Head fa_IR RTL qualification
        shell: bash
        env:
          WU008_G009_PROFILE: rtl
        run: |
          set -euo pipefail
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo get_locale();')" = "fa_IR"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "rtl"
          node tests/real-integration/g009-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g009-evidence-rtl.json"

      - name: Execute LTR control qualification
        shell: bash
        env:
          WU008_G009_PROFILE: ltr
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" option delete WPLANG --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo get_locale();')" = "en_US"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "ltr"
          node tests/real-integration/g009-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g009-evidence-ltr.json"

      - name: Restore Persian locale and prove the control did not mutate product state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" option update WPLANG fa_IR --path="$WU008_WP_PATH"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo get_locale();')" = "fa_IR"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "rtl"
          test "$(php "$WU008_WP_CLI" plugin get persian-gravityforms --field=version --path="$WU008_WP_PATH")" = "$WU008_PGR_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityforms --field=version --path="$WU008_WP_PATH")" = "$WU008_GF_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityflow --field=version --path="$WU008_WP_PATH")" = "$WU008_FLOW_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityview --field=version --path="$WU008_WP_PATH")" = "$WU008_VIEW_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gravityperks --field=version --path="$WU008_WP_PATH")" = "$WU008_PERKS_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gp-file-upload-pro --field=version --path="$WU008_WP_PATH")" = "$WU008_FUP_VERSION"
          test "$(php "$WU008_WP_CLI" plugin get gp-advanced-select --field=version --path="$WU008_WP_PATH")" = "$WU008_ADVS_VERSION"

      - name: Qualify GravityView G008 system dates across enabled, native, drift and LTR controls
        shell: bash
        run: |
          set -euo pipefail
          for mode in enabled disabled version-drift english; do
            WU008_G008_GV_MODE="$mode" WU008_G008_GV_PHASE=pre               php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-gravityview-state.php
            WU008_G008_GV_MODE="$mode" node tests/real-integration/g008-gravityview-browser.mjs
            WU008_G008_GV_MODE="$mode" WU008_G008_GV_PHASE=post               php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-gravityview-state.php
            test -s "$WU008_ARTIFACT_DIR/g008-gravityview-browser-$mode.json"
            test -s "$WU008_ARTIFACT_DIR/g008-gravityview-state-$mode-pre.json"
            test -s "$WU008_ARTIFACT_DIR/g008-gravityview-state-$mode-post.json"
          done
          php "$WU008_WP_CLI" option update WPLANG fa_IR --path="$WU008_WP_PATH"
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'update_option( "wu008_g008_gravityview_force_version_mismatch", false ); PGR_Module_Registry::set_enabled( "jalali_presentation", true );'
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo determine_locale();')" = "fa_IR"
          test "$(php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'echo is_rtl() ? "rtl" : "ltr";')" = "rtl"

      - name: Reconcile GravityView G008 qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-gravityview-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-gravityview-qualification.json"

      - name: Create G008 Flow Inbox fixtures after G009 isolation checks
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-inbox-setup-runtime.php
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-fixture-baseline.json"

      - name: Prove enabled G008 Flow Inbox presentation and operational state
        shell: bash
        env:
          WU008_G008_MODE: enabled
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-inbox-state.php
          node tests/real-integration/g008-flow-inbox-browser.mjs
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-status-state.php
          node tests/real-integration/g008-flow-status-browser.mjs
          node tests/real-integration/g008-flow-residual-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-state-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-browser-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-status-state-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-status-browser-enabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-residual-browser-enabled.json"

      - name: Prove module-disabled native Gravity Flow fallback
        shell: bash
        env:
          WU008_G008_MODE: disabled
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", false );'
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-inbox-state.php
          node tests/real-integration/g008-flow-inbox-browser.mjs
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-status-state.php
          node tests/real-integration/g008-flow-status-browser.mjs
          node tests/real-integration/g008-flow-residual-browser.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-state-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-browser-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-status-state-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-status-browser-disabled.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-residual-browser-disabled.json"
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", true );'

      - name: Reconcile G008 Flow Inbox admission evidence
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-flow-inbox-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-inbox-admission.json"

      - name: Reconcile G008 Flow Status admission evidence
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g008-flow-status-reconcile.mjs
          test -s "$WU008_ARTIFACT_DIR/g008-flow-status-admission.json"

      - name: Create isolated residual Entry Detail, Timeline and schedule fixtures
        shell: bash
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-residual-adversarial-setup.php
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-schedule-setup.php
          test -s "$WU008_ARTIFACT_DIR/g008-flow-residual-adversarial-fixture.json"
          test -s "$WU008_ARTIFACT_DIR/g008-flow-schedule-fixture.json"

      - name: Qualify Entry Detail candidate, schedule, Timeline and Print with module enabled
        shell: bash
        env:
          WU008_G008_MODE: enabled
        run: |
          set -euo pipefail
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval 'PGR_Module_Registry::set_enabled( "jalali_presentation", true );'
          php "$WU008_WP_CLI" --path="$WU008_WP_PATH" eval-file tests/real-integration/g008-flow-residual-adversarial-state.php
          node tests/real-integration/g008-entry-detail-candidate-browser.mjs
