          gv_main="$WU008_WP_PATH/wp-content/plugins/gravityview/gravityview.php"
          gv_backup=/tmp/wu008-gravityview-main.php
          cp "$gv_main" "$gv_backup"
          gv_sha="$(sha256sum "$gv_main" | awk '{print $1}')"
          restore_gv() {
            cp "$gv_backup" "$gv_main"
            echo "$gv_sha  $gv_main" | sha256sum -c -
            rm -f "$gv_backup"
          }
          trap restore_gv EXIT
          read_gv_header_version() {
            php -r '
              $data = file_get_contents($argv[1], false, null, 0, 8192);
              if (!is_string($data) || !preg_match("/^(?:[ \\t]*<\\?(?:php)?)?[ \\t\\/*#@]*Version:(.*)$/mi", $data, $m)) { exit(1); }
              $value = preg_replace("/\\s*(?:\\*\\/|\\?>).*/", "", $m[1]);
              echo trim((string) $value);
            ' "$gv_main"
          }
          test "$(read_gv_header_version)" = "3.3.4"
          php -r '
            $path = $argv[1];
            $content = file_get_contents($path);
            if (!is_string($content)) { fwrite(STDERR, "GravityView header read failed\n"); exit(1); }
            $prefix = substr($content, 0, 8192);
            if (!preg_match("/^(?:[ \\t]*<\\?(?:php)?)?[ \\t\\/*#@]*Version:(.*)$/mi", $prefix, $match, PREG_OFFSET_CAPTURE)) {
              fwrite(STDERR, "GravityView plugin Version header not found\n");
              exit(1);
            }
            $line = $match[0][0];
            $offset = $match[0][1];
            $updated_line = preg_replace("/3\\.3\\.4/", "3.3.5", $line, 1, $count);
            if (!is_string($updated_line) || $count !== 1) {
              fwrite(STDERR, "GravityView plugin Version header drift injection failed\n");
              exit(1);
            }
            $updated = substr_replace($content, $updated_line, $offset, strlen($line));
            if (false === file_put_contents($path, $updated)) { exit(1); }
          ' "$gv_main"
