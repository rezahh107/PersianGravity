name: Temporary PR68 own-catalog translation and MO build

on:
  push:
    branches:
      - feat/g010-wu02-compatibility-diagnostics
    paths:
      - .github/workflows/tmp-pr68-own-catalog-translate.yml

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/g010-wu02-compatibility-diagnostics

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install catalog tooling
        run: |
          python -m pip install --disable-pip-version-check polib==1.2.0
          sudo apt-get update && sudo apt-get install --yes gettext

      - name: Fill required Persian translations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import polib

          path = 'languages/persian-gravityforms-fa_IR.po'
          po = polib.pofile(path)
          translations = {
              'Persian Gravity Forms': 'فرم‌های پرشین گرویتی',
              'Generic Persian and Iranian enhancements for Gravity Forms.': 'قابلیت‌های عمومی فارسی و ایرانی برای Gravity Forms.',
              'PGR Team': 'تیم PGR',
              'National ID defaults': 'پیش‌فرض‌های کد ملی',
              'Normalize digits while typing': 'نرمال‌سازی ارقام هنگام تایپ',
              'National ID': 'کد ملی',
              'Server-authoritative Iranian National ID validation and digit normalization.': 'اعتبارسنجی مرجع سمت سرور برای کد ملی ایران و نرمال‌سازی ارقام.',
              'Dedicated Jalali date field with canonical Jalali storage semantics.': 'فیلد اختصاصی تاریخ جلالی با معنای ذخیره‌سازی مرجع جلالی.',
              'Iranian Address': 'آدرس ایران',
              'Iranian address type and province choices for Gravity Forms.': 'نوع آدرس ایران و گزینه‌های استان برای Gravity Forms.',
              'Persian and Arabic digit normalization at supported input and save boundaries.': 'نرمال‌سازی ارقام فارسی و عربی در مرزهای ورودی و ذخیره‌سازی پشتیبانی‌شده.',
              'IRR / IRT currency': 'ارز IRR / IRT',
              'Iranian Rial and Toman currency definitions.': 'تعریف ارز ریال و تومان ایران.',
              'A non-persistent controller that parses structured scanner input and populates ordinary Gravity Forms fields.': 'کنترل‌گری غیرماندگار که ورودی ساختاریافته اسکنر را تجزیه می‌کند و فیلدهای عادی Gravity Forms را پر می‌کند.',
              'Relevant runtime facts for this installation. No secrets or destructive actions are exposed here.': 'اطلاعات مرتبط با اجرای این نصب. هیچ راز یا اقدام مخربی در اینجا نمایش داده نمی‌شود.',
              'PersianGravity': 'پرشین گرویتی',
              'WordPress': 'وردپرس',
              'PHP': 'PHP',
              'Gravity Forms': 'Gravity Forms',
              'Profile registry': 'رجیستری پروفایل',
              'Scanner Profiles v1 uses only the bounded newline-based segments_v1 parser. No executable rules or regular-expression language is stored.': 'پروفایل‌های اسکنر نسخه ۱ فقط از تجزیه‌گر محدود segments_v1 مبتنی بر خط جدید استفاده می‌کند. هیچ قانون اجرایی یا زبان عبارت منظم ذخیره نمی‌شود.',
              'ASCII identifier. It cannot be changed after creation.': 'شناسه ASCII. پس از ایجاد قابل تغییر نیست.',
              'Active and selectable for new Scanner fields': 'فعال و قابل انتخاب برای فیلدهای جدید اسکنر',
              'Parser': 'تجزیه‌گر',
              'Newline-separated ordered segments.': 'بخش‌های مرتب‌شده و جداشده با خط جدید.',
              'Trim surrounding whitespace': 'حذف فاصله‌های خالی ابتدا و انتها',
              'Normalize Persian/Arabic digits to ASCII': 'تبدیل ارقام فارسی/عربی به ASCII',
              'Outputs': 'خروجی‌ها',
              'Order is part of the parser contract.': 'ترتیب بخشی از قرارداد تجزیه‌گر است.',
              'Add output': 'افزودن خروجی',
              'Save Profile': 'ذخیره پروفایل',
              'This profile is built into PersianGravity and is read-only.': 'این پروفایل داخلی PersianGravity است و فقط‌خواندنی است.',
              'Duplicate as custom profile': 'تکثیر به‌عنوان پروفایل سفارشی',
              'Up': 'بالا',
              'Down': 'پایین',
              'You are not allowed to manage Scanner Profiles.': 'شما اجازه مدیریت پروفایل‌های اسکنر را ندارید.',
              'Scanner profile saved.': 'پروفایل اسکنر ذخیره شد.',
              'Scanner profile deleted.': 'پروفایل اسکنر حذف شد.',
              'Profile duplicated. Review the new custom profile before use.': 'پروفایل تکثیر شد. پیش از استفاده، پروفایل سفارشی جدید را بررسی کنید.',
              'The Scanner profile could not be saved. Check the profile ID, labels, parser settings, and output definitions.': 'پروفایل اسکنر ذخیره نشد. شناسه پروفایل، برچسب‌ها، تنظیمات تجزیه‌گر و تعریف خروجی‌ها را بررسی کنید.',
              'The Scanner profile could not be deleted.': 'پروفایل اسکنر حذف نشد.',
              'The Scanner profile could not be duplicated.': 'پروفایل اسکنر تکثیر نشد.',
              'Unavailable': 'در دسترس نیست',
              'Warning': 'هشدار',
              'Gravity Flow compatibility diagnostics': 'عیب‌یابی سازگاری Gravity Flow',
              'Informational maintenance evidence only. These observations do not enable or disable compatibility.': 'فقط شواهد اطلاعاتی برای نگهداری. این مشاهدات سازگاری را فعال یا غیرفعال نمی‌کنند.',
              'Capability': 'قابلیت',
              'State': 'وضعیت',
              'Reason': 'دلیل',
              'Observed Gravity Flow': 'نسخه مشاهده‌شده Gravity Flow',
              'Last observed': 'آخرین مشاهده',
              'Not observed': 'مشاهده نشده',
              'Scanner profile': 'پروفایل اسکنر',
              'Select a profile': 'یک پروفایل انتخاب کنید',
              'Output mapping': 'نگاشت خروجی',
              'Map profile outputs to ordinary Single Line Text or Hidden fields. Outputs may remain unmapped.': 'خروجی‌های پروفایل را به فیلدهای معمولی متن تک‌خطی یا مخفی نگاشت کنید. خروجی‌ها می‌توانند بدون نگاشت باقی بمانند.',
              'Not mapped': 'نگاشت نشده',
              'Field %1$s — %2$s': 'فیلد %1$s — %2$s',
              'Field %s — missing or unsupported': 'فیلد %s — موجود نیست یا پشتیبانی نمی‌شود',
              'The selected Scanner profile is no longer available: %s': 'پروفایل اسکنر انتخاب‌شده دیگر در دسترس نیست: %s',
              'Scanner mapping metadata is invalid.': 'فراداده نگاشت اسکنر نامعتبر است.',
              'A configured Scanner target field no longer exists.': 'فیلد مقصد پیکربندی‌شده اسکنر دیگر وجود ندارد.',
              'A configured Scanner target is not a supported Single Line Text or Hidden field.': 'مقصد پیکربندی‌شده اسکنر یک فیلد متن تک‌خطی یا مخفی پشتیبانی‌شده نیست.',
              'Two Scanner outputs cannot map to the same destination field.': 'دو خروجی اسکنر نمی‌توانند به یک فیلد مقصد یکسان نگاشت شوند.',
              'Structured Scanner cannot target itself.': 'اسکنر ساختاریافته نمی‌تواند خودش را به‌عنوان مقصد انتخاب کند.',
              'Destination': 'مقصد',
              'unavailable': 'در دسترس نیست',
          }

          for entry in po:
              if entry.obsolete:
                  continue
              if entry.msgid in translations:
                  entry.msgstr = translations[entry.msgid]
                  entry.flags = [flag for flag in entry.flags if flag != 'fuzzy']
              elif any('\u0600' <= ch <= '\u06ff' for ch in entry.msgid):
                  entry.msgstr = entry.msgid
                  entry.flags = [flag for flag in entry.flags if flag != 'fuzzy']

          incomplete = [entry.msgid for entry in po if not entry.obsolete and ('fuzzy' in entry.flags or (not entry.msgstr and not entry.msgstr_plural))]
          if incomplete:
              raise SystemExit('Untranslated/fuzzy active entries remain:\n' + '\n'.join(f'- {msgid}' for msgid in incomplete))

          po.save(path)
          PY

      - name: Validate and compile MO
        shell: bash
        run: |
          set -euo pipefail
          msgfmt --check --output-file=languages/persian-gravityforms-fa_IR.mo languages/persian-gravityforms-fa_IR.po
          msgcmp languages/persian-gravityforms-fa_IR.po languages/persian-gravityforms.pot

      - name: Commit repaired PO and MO
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add languages/persian-gravityforms-fa_IR.po languages/persian-gravityforms-fa_IR.mo
          git diff --cached --check
          git commit -m 'fix(i18n): translate regenerated own-plugin catalog'
          git push origin HEAD:feat/g010-wu02-compatibility-diagnostics
