name: G-006 GravityView translation draft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install draft tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown==5.2.0 polib==1.2.0
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python3 -m pip install --quiet 'transformers==4.57.1' 'sentencepiece==0.2.1'

      - name: Download exact GravityView 3.3.4 package
        run: |
          set -euo pipefail
          mkdir -p /tmp/g006/package /tmp/g006/src /tmp/g006/out
          gdown 16gDLYvZyA0SYvNl44d2O1n5C9nxFbkm1 -O /tmp/g006/package/gravityview.zip
          echo 'af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829  /tmp/g006/package/gravityview.zip' | sha256sum -c -
          unzip -q /tmp/g006/package/gravityview.zip -d /tmp/g006/src
          gv_root="$(find /tmp/g006/src -type f -path '*/gravityview.php' -printf '%h\n' | head -1)"
          test -n "$gv_root"
          grep -Eq '^ \* Version:[[:space:]]*3\.3\.4[[:space:]]*$' "$gv_root/gravityview.php"
          printf '%s\n' "$gv_root" > /tmp/g006/root.txt

      - name: Reconstruct canonical source census and exact residual
        run: |
          set -euo pipefail
          gv_root="$(cat /tmp/g006/root.txt)"
          php tools/i18n/extract-gravityview-source.php "$gv_root" /tmp/g006/out/source.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import polib

          US = '\x1f'
          source = json.loads(Path('/tmp/g006/out/source.json').read_text())
          primary = source['domains']['gk-gravityview']

          assert primary['canonical_message_count'] == 3127, primary['canonical_message_count']
          assert primary['context_message_count'] == 127, primary['context_message_count']
          assert primary['plural_message_count'] == 42, primary['plural_message_count']
          assert primary['source_reference_count'] == 3931, primary['source_reference_count']
          assert primary['canonical_keyset_sha256'] == '3b533294de818bd7e772533512424571c85e5aa7bccb78cfe06b8b6820645c95', primary['canonical_keyset_sha256']
          assert primary['source_reference_index_sha256'] == '4332466a4f585fd66110b7158d0bbfbf1947ef9e4a97bb924e9c0800fbf64c34', primary['source_reference_index_sha256']

          qf = source['domains']['gk-query-filters']
          assert qf['canonical_message_count'] == 97
          assert qf['canonical_keyset_sha256'] == '138f359d520c76ba59d00489f839f07a10fa066d597b74181e2aec9e259ae9a6'

          sched = source['domains']['action-scheduler']
          assert sched['canonical_message_count'] == 193
          assert sched['canonical_keyset_sha256'] == '5ac30ba0b99a308502289607a8b84309374f65ed25781b1692ed649fe9ae3a17'

          assert len(source['dynamic_calls']) == 1
          dynamic = source['dynamic_calls'][0]
          assert dynamic['domain'] == 'gk-gravityview'
          assert dynamic['function'] == 'esc_html__'
          assert dynamic['reference'] == 'vendor_prefixed/gravitykit/foundation/src/Scheduler/Models/HealthCheck.php:329'

          def identity(ctx, msgid, plural):
              return hashlib.sha256(((ctx or '') + US + msgid + US + (plural or '')).encode()).hexdigest()

          accepted = {}
          po = polib.pofile('languages/providers/gravityview/source/fa_IR.po')
          for entry in po:
              if not entry.msgid:
                  continue
              ident = identity(entry.msgctxt, entry.msgid, entry.msgid_plural)
              assert ident not in accepted
              values = list(entry.msgstr_plural.values()) if entry.msgid_plural else [entry.msgstr]
              assert values and all(v.strip() for v in values)
              accepted[ident] = {
                  'msgctxt': entry.msgctxt,
                  'msgid': entry.msgid,
                  'msgid_plural': entry.msgid_plural or None,
                  'msgstr': values,
              }

          assert len(accepted) == 461, len(accepted)
          accepted_ids = sorted(accepted)
          assert hashlib.sha256(('\n'.join(accepted_ids) + '\n').encode()).hexdigest() == 'f5451db1aad8e945dd50c18bdb703825d4f2a57b36d5feb6a4dba23e65f7d643'

          canonical = {e['identity']: e for e in primary['entries']}
          assert len(canonical) == 3127
          assert set(accepted).issubset(canonical)

          residual_ids = sorted(set(canonical) - set(accepted))
          assert len(residual_ids) == 2666, len(residual_ids)
          assert not set(residual_ids) & set(accepted)
          assert set(residual_ids) | set(accepted) == set(canonical)

          residual = [canonical[i] for i in residual_ids]
          payload = {
              'schema_version': 1,
              'product': 'gravityview',
              'domain': 'gk-gravityview',
              'locale': 'fa_IR',
              'target_version': '3.3.4',
              'source_package_sha256': 'af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829',
              'canonical_message_count': 3127,
              'canonical_keyset_sha256': primary['canonical_keyset_sha256'],
              'source_reference_index_sha256': primary['source_reference_index_sha256'],
              'preexisting_accepted_message_count': 461,
              'preexisting_accepted_keyset_sha256': hashlib.sha256(('\n'.join(accepted_ids) + '\n').encode()).hexdigest(),
              'remainder_message_count': 2666,
              'remainder_keyset_sha256': hashlib.sha256(('\n'.join(residual_ids) + '\n').encode()).hexdigest(),
              'entries': residual,
          }
          Path('/tmp/g006/out/residual.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          Path('/tmp/g006/out/accepted.json').write_text(json.dumps({'count': 461, 'entries': accepted}, ensure_ascii=False, indent=2) + '\n')
          print('G006_GRAVITYVIEW_CENSUS_PASS 461 + 2666 = 3127')
          print('remainder_keyset_sha256=' + payload['remainder_keyset_sha256'])
          PY

      - name: Upload canonical census before draft generation
        uses: actions/upload-artifact@v4
        with:
          name: g006-gravityview-census
          path: |
            /tmp/g006/out/source.json
            /tmp/g006/out/residual.json
            /tmp/g006/out/accepted.json
          if-no-files-found: error
          retention-days: 7

      - name: Load exact-match historical Persian translation memory
        run: |
          set -euo pipefail
          curl -fsSL \
            'https://raw.githubusercontent.com/OscarCampohermoso/Proyectos-Web-PHP-MariaDB/f07be38488f3ec64f3ce1e80e00444e2aedb7b56/htdocs-xampp/wordpress/wp-content/plugins/gravityview/languages/gravityview-fa_IR.po' \
            -o /tmp/g006/out/historical-gravityview-2.15-fa_IR.po
          sha256sum /tmp/g006/out/historical-gravityview-2.15-fa_IR.po | tee /tmp/g006/out/historical-gravityview-2.15-fa_IR.sha256
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          import polib

          US = '\x1f'
          po = polib.pofile('/tmp/g006/out/historical-gravityview-2.15-fa_IR.po')
          memory = {}
          for entry in po:
              if not entry.msgid or 'fuzzy' in entry.flags:
                  continue
              values = list(entry.msgstr_plural.values()) if entry.msgid_plural else [entry.msgstr]
              if not values or not all(isinstance(v, str) and v.strip() for v in values):
                  continue
              identity = hashlib.sha256(
                  ((entry.msgctxt or '') + US + entry.msgid + US + (entry.msgid_plural or '')).encode()
              ).hexdigest()
              memory[identity] = values

          Path('/tmp/g006/out/historical-tm.json').write_text(
              json.dumps(
                  {
                      'schema_version': 1,
                      'source': 'GravityView 2.15 community Persian PO; exact identity matches only',
                      'count': len(memory),
                      'translations': memory,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + '\n'
          )
          print('historical_tm_nonempty=' + str(len(memory)))
          PY

      - name: Generate Persian review draft
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          data = json.loads(Path('/tmp/g006/out/residual.json').read_text())
          entries = data['entries']
          historical = json.loads(Path('/tmp/g006/out/historical-tm.json').read_text())['translations']

          protected = re.compile(
              r'(https?://[^\s<>"\']+'
              r'|%(?:\d+\$)?[-+0#\']*(?:\d+|\*)?(?:\.(?:\d+|\*))?[bcdeEfFgGosuxX]'
              r'|\{[^{}\r\n]+\}'
              r'|</?[A-Za-z][^>]*>'
              r'|&#(?:\d+|x[0-9A-Fa-f]+);'
              r'|\[[A-Za-z][^\]\r\n]*\]'
              r'|`[^`\\r\\n]+`'
              r'|\\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\\b'
              r'|\\b[a-z][a-z0-9_]*(?:\\.[a-z][a-z0-9_]*)+\\b'
              r'|Gravity Forms|GravityView|GravityKit(?:\\.com)?|WordPress|JavaScript|JSON|HTML|CSS|PHP|REST API|REST|API|URLs?|AJAX|OAuth|SMTP|HTTPS?|UTC|UID|SVG|CSV)'
          )
          natural = re.compile(r'[A-Za-z]')

          segments = []
          segment_index = {}
          plans = {}

          def plan(value):
              if value is None:
                  return None
              parts = protected.split(value)
              out = []
              for idx, part in enumerate(parts):
                  if not part:
                      continue
                  if idx % 2 == 1 or not natural.search(part) or re.fullmatch(r'[\s\W_\d]+', part):
                      out.append(('literal', part))
                      continue
                  if part not in segment_index:
                      segment_index[part] = len(segments)
                      segments.append(part)
                  out.append(('segment', segment_index[part]))
              return out

          for e in entries:
              plans[e['identity']] = (plan(e['msgid']), plan(e.get('msgid_plural')))

          name = 'facebook/nllb-200-distilled-600M'
          tok = AutoTokenizer.from_pretrained(name, src_lang='eng_Latn')
          model = AutoModelForSeq2SeqLM.from_pretrained(name)
          model.eval()
          target = tok.convert_tokens_to_ids('pes_Arab')
          translated = [''] * len(segments)

          with torch.inference_mode():
              for start in range(0, len(segments), 32):
                  batch_text = segments[start:start + 32]
                  batch = tok(batch_text, return_tensors='pt', padding=True, truncation=True, max_length=512)
                  generated = model.generate(
                      **batch,
                      forced_bos_token_id=target,
                      max_new_tokens=384,
                      num_beams=1,
                  )
                  translated[start:start + len(batch_text)] = tok.batch_decode(generated, skip_special_tokens=True)
                  if start % 256 == 0:
                      print(f'drafted {start}/{len(segments)}', flush=True)

          def render(parts):
              if parts is None:
                  return None
              return ''.join(value if kind == 'literal' else translated[value] for kind, value in parts).strip()

          drafts = []
          historical_hits = 0
          for e in entries:
              singular_plan, plural_plan = plans[e['identity']]
              generated_values = [render(singular_plan)]
              if plural_plan is not None:
                  generated_values.append(render(plural_plan))
              values = historical.get(e['identity'], generated_values)
              source = 'HISTORICAL_EXACT_IDENTITY' if e['identity'] in historical else 'NLLB_DRAFT'
              if source == 'HISTORICAL_EXACT_IDENTITY':
                  historical_hits += 1
              assert all(isinstance(v, str) and v.strip() for v in values)
              expected_forms = 2 if e.get('msgid_plural') is not None else 1
              if len(values) != expected_forms:
                  values = generated_values
                  source = 'NLLB_DRAFT_PLURAL_FALLBACK'
              drafts.append({
                  'identity': e['identity'],
                  'msgctxt': e.get('msgctxt'),
                  'msgid': e['msgid'],
                  'msgid_plural': e.get('msgid_plural'),
                  'references': e.get('references', []),
                  'draft_msgstr': values,
                  'generated_msgstr': generated_values,
                  'draft_source': source,
              })
          print('historical_exact_identity_hits=' + str(historical_hits))

          Path('/tmp/g006/out/draft.json').write_text(json.dumps({
              'schema_version': 1,
              'model': name,
              'status': 'DRAFT_ONLY_NOT_ACCEPTED',
              'count': len(drafts),
              'entries': drafts,
          }, ensure_ascii=False, indent=2) + '\n')
          assert len(drafts) == 2666
          PY

      - name: Upload review inputs
        uses: actions/upload-artifact@v4
        with:
          name: g006-gravityview-review-inputs
          path: /tmp/g006/out/
          if-no-files-found: error
          retention-days: 7
