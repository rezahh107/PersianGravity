name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext

      - name: Validate Persian gettext catalog
        shell: bash
        run: |
          set -euo pipefail
          tmp_mo=/tmp/persian-gravityforms-fa_IR.mo
          trap 'rm -f "$tmp_mo"' EXIT
          msgfmt --check --output-file="$tmp_mo" languages/persian-gravityforms-fa_IR.po
          msgcmp languages/persian-gravityforms-fa_IR.po languages/persian-gravityforms.pot
          echo "GNU_MSGFMT_BASE64=$(base64 -w0 "$tmp_mo")"
          cmp -s "$tmp_mo" languages/persian-gravityforms-fa_IR.mo

      - name: Syntax check shipped PHP
        run: find persian-gravityforms.php includes admin uninstall.php -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: WordPress Coding Standards
        run: composer cs

      - name: PHPCompatibility minimum baseline
        run: composer compat

      - name: Structured Scanner pure JavaScript tests
        run: node --test tests/js/structured-scanner.test.js

      - name: Runtime integrity guard
        shell: bash
        run: |
          test ! -d src
          test ! -d assets/fonts
          test ! -f persian-gravityforms-refactor.php
          test ! -f assets/js/jalali-datepicker.js
          test ! -f assets/js/jalali-datepicker.min.js
          ! grep -R -n -E 'GFPersian_|mellicart|ir_national_id|load_textdomain_mofile|registration_counter|pgrJalali|jquery-ui-datepicker|wp_deregister_script' persian-gravityforms.php includes admin
          test -f includes/fields/class-gf-field-national-id.php
          test -f includes/fields/class-gf-field-jalali-date.php
          test -f includes/fields/class-gf-field-structured-scanner.php
          test -f includes/class-pgr-scanner-profile-registry.php

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: composer test
