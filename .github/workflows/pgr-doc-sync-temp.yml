name: Temporary content-admission doc sync

on:
  push:
    branches:
      - feat/gravityflow-classified-content-admission-v2
    paths:
      - .github/workflows/pgr-doc-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize current content-admission documentation
        run: python .github/pgr-doc-sync-temp.py

      - name: Commit documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LOCALIZATION.md docs/ARCHITECTURE_CONTENT_ADMISSION_V2.md docs/VALIDATION_CONTENT_ADMISSION_V2.md languages/README.md
          git diff --cached --check
          git commit -m 'docs: sync current content-admission authority'
          git fetch origin feat/gravityflow-classified-content-admission-v2
          git rebase origin/feat/gravityflow-classified-content-admission-v2
          git push origin HEAD:feat/gravityflow-classified-content-admission-v2
