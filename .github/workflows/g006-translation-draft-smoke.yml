name: G-006 translation draft smoke

on:
  push:
    branches: [feat/g006-full-provider-coverage]
    paths: [.github/workflows/g006-translation-draft-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install development-only translation model tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python3 -m pip install --quiet 'transformers==4.57.1' 'sentencepiece==0.2.1'
      - name: Exercise development-only NLLB Persian draft model
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          name='facebook/nllb-200-distilled-600M'
          tok=AutoTokenizer.from_pretrained(name, src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(name)
          texts=['Workflow Steps','You are not allowed to cancel workflows.','The entry is on a workflow step type which cannot be updated via the API.']
          batch=tok(texts,return_tensors='pt',padding=True,truncation=True)
          out=model.generate(**batch,forced_bos_token_id=tok.convert_tokens_to_ids('pes_Arab'),max_new_tokens=160)
          for src,dst in zip(texts,tok.batch_decode(out,skip_special_tokens=True)):
              print(src,'=>',dst)
          PY
