name: G-006 translation draft

on:
  push:
    branches: [feat/g006-full-provider-coverage]
    paths:
      - .github/workflows/g006-translation-draft-smoke.yml
      - tools/i18n/extract-gravityview-source.php

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install development-only draft tooling
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown==5.2.0 polib==1.2.0
          python3 -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python3 -m pip install --quiet 'transformers==4.57.1' 'sentencepiece==0.2.1'
      - name: Download and verify exact locked product packages
        run: |
          set -euo pipefail
          mkdir -p /tmp/g006/packages /tmp/g006/src
          gdown --id 1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy -O /tmp/g006/packages/gravityforms.zip
          gdown --id 1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf -O /tmp/g006/packages/gravityflow.zip
          gdown --id 16gDLYvZyA0SYvNl44d2O1n5C9nxFbkm1 -O /tmp/g006/packages/gravityview.zip
          echo '542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  /tmp/g006/packages/gravityforms.zip' | sha256sum -c -
          echo 'ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404  /tmp/g006/packages/gravityflow.zip' | sha256sum -c -
          echo 'af5959fb6bf0cfcb4d07d14b1933cf9ea0a9d0f994b9991f27aed47edbcb9829  /tmp/g006/packages/gravityview.zip' | sha256sum -c -
          unzip -q /tmp/g006/packages/gravityforms.zip -d /tmp/g006/src/gf
          unzip -q /tmp/g006/packages/gravityflow.zip -d /tmp/g006/src/flow
          unzip -q /tmp/g006/packages/gravityview.zip -d /tmp/g006/src/view
      - name: Reconstruct exact canonical residual census
        run: |
          set -euo pipefail
          gv_root="$(find /tmp/g006/src/view -type f -path '*/gravityview.php' -printf '%h\n' | head -1)"
          test -n "$gv_root"
          php tools/i18n/extract-gravityview-source.php "$gv_root" /tmp/g006/view.json
          python3 - <<'PY'
          import hashlib,json,os,polib
          from pathlib import Path
          US='\x1f'
          def identity(ctx,msgid,plural):
              return hashlib.sha256(((ctx or '')+US+msgid+US+(plural or '')).encode()).hexdigest()
          def po_entries(path):
              out={}
              for e in polib.pofile(str(path)):
                  if not e.msgid: continue
                  i=identity(e.msgctxt,e.msgid,e.msgid_plural)
                  out[i]={'identity':i,'msgctxt':e.msgctxt,'msgid':e.msgid,'msgid_plural':e.msgid_plural or None,'references':[f'{p}:{n}' if n else p for p,n in e.occurrences]}
              return out
          def keyhash(ids,trailing=False):
              value='\n'.join(sorted(ids))+ ('\n' if trailing and ids else '')
              return hashlib.sha256(value.encode()).hexdigest()
          roots={
              'gravityforms': next(Path('/tmp/g006/src/gf').rglob('languages/gravityforms.pot')),
              'gravityflow': next(Path('/tmp/g006/src/flow').rglob('languages/gravityflow.pot')),
          }
          full={}
          gf=po_entries(roots['gravityforms'])
          stale=[i for i,e in gf.items() if e['msgid']=="I'm a Button!" and any('tests/playwright/mu-plugins/snippets/gform_settings_header_buttons.php:5' in r for r in e['references'])]
          assert len(stale)==1
          del gf[stale[0]]
          assert len(gf)==4207 and keyhash(gf)=='1b92edc87f2d152cb98a026dde815ab93e3e8303eef2954e95b3a816a85801fb'
          full['gravityforms']=gf
          flow=po_entries(roots['gravityflow'])
          assert len(flow)==1098 and keyhash(flow)=='cea9efe9c99f0e4424de029137ecef044133129684918ba6523f4691e6d58c82'
          full['gravityflow']=flow
          gv=json.load(open('/tmp/g006/view.json'))
          primary=gv['domains']['gk-gravityview']
          assert primary['canonical_message_count']==3127 and primary['canonical_keyset_sha256']=='3b533294de818bd7e772533512424571c85e5aa7bccb78cfe06b8b6820645c95'
          assert gv['domains']['gk-query-filters']['canonical_message_count']==97 and gv['domains']['gk-query-filters']['canonical_keyset_sha256']=='138f359d520c76ba59d00489f839f07a10fa066d597b74181e2aec9e259ae9a6'
          assert gv['domains']['action-scheduler']['canonical_message_count']==193 and gv['domains']['action-scheduler']['canonical_keyset_sha256']=='5ac30ba0b99a308502289607a8b84309374f65ed25781b1692ed649fe9ae3a17'
          assert gv['dynamic_calls']==[{'domain':'gk-gravityview','function':'esc_html__','reference':'vendor_prefixed/gravitykit/foundation/src/Scheduler/Models/HealthCheck.php:329'}]
          full['gravityview']={e['identity']:e for e in primary['entries']}
          accepted={}
          for product in full:
              po=Path('languages/providers')/product/'source/fa_IR.po'
              accepted[product]=set(po_entries(po))
          expected={'gravityforms':(1759,2448),'gravityflow':(732,366),'gravityview':(461,2666)}
          residual=[]
          for product,catalog in full.items():
              old,res=expected[product]
              assert len(accepted[product])==old
              ids=set(catalog)-accepted[product]
              assert len(ids)==res
              for i in sorted(ids): residual.append({'product':product,**catalog[i]})
          assert len(residual)==5480
          Path('/tmp/g006/residual.json').write_text(json.dumps({'schema_version':1,'count':5480,'entries':residual},ensure_ascii=False)+'\n')
          print('Residual census PASS:', {p: expected[p][1] for p in expected})
          PY
      - name: Generate NLLB Persian drafts with functional tokens isolated
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer
          import torch
          data=json.load(open('/tmp/g006/residual.json'))
          protected=re.compile(r'(https?://[^\s<>"\']+|%(?:\d+\$)?[-+0#\']*(?:\d+|\*)?(?:\.(?:\d+|\*))?[bcdeEfFgGosuxX]|\$\{[^{}\r\n]+\}|\{[^{}\r\n]+\}|</?[A-Za-z][^>]*>|&#(?:\d+|x[0-9A-Fa-f]+);|`[^`]+`|Gravity Forms|Gravity Flow|GravityView|WordPress|JavaScript|JSON|HTML|CSS|PHP|API|URL)')
          natural=re.compile(r'[A-Za-z]')
          segments=[]; segment_index={}
          plans={}
          def plan(value):
              if value is None: return None
              parts=protected.split(value); out=[]
              for idx,part in enumerate(parts):
                  if not part: continue
                  if idx%2==1 or not natural.search(part) or re.fullmatch(r'[\s\W_\d]+',part):
                      out.append(('literal',part)); continue
                  key=part
                  if key not in segment_index:
                      segment_index[key]=len(segments); segments.append(key)
                  out.append(('segment',segment_index[key]))
              return out
          for e in data['entries']:
              plans[e['identity']]=[plan(e['msgid']),plan(e.get('msgid_plural'))]
          print('Unique natural segments:',len(segments))
          name='facebook/nllb-200-distilled-600M'
          tok=AutoTokenizer.from_pretrained(name,src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(name)
          model.eval(); target=tok.convert_tokens_to_ids('pes_Arab'); translations=['']*len(segments)
          batch_size=16
          with torch.inference_mode():
              for start in range(0,len(segments),batch_size):
                  batch_text=segments[start:start+batch_size]
                  batch=tok(batch_text,return_tensors='pt',padding=True,truncation=True,max_length=512)
                  out=model.generate(**batch,forced_bos_token_id=target,max_new_tokens=384,num_beams=1)
                  translations[start:start+len(batch_text)]=tok.batch_decode(out,skip_special_tokens=True)
                  if start%256==0: print('drafted',start,'/',len(segments),flush=True)
          def render(plan):
              if plan is None:return None
              return ''.join(value if kind=='literal' else translations[value] for kind,value in plan).strip()
          output={}
          for e in data['entries']:
              a,b=plans[e['identity']]
              vals=[render(a)]
              if b is not None: vals.append(render(b))
              output[e['identity']]={'product':e['product'],'msgstr':vals}
          Path('/tmp/g006/nllb-draft.json').write_text(json.dumps({'schema_version':1,'model':name,'count':len(output),'translations':output},ensure_ascii=False,indent=2)+'\n')
          assert len(output)==5480 and all(all(isinstance(x,str) and x for x in v['msgstr']) for v in output.values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g006-nllb-draft
          path: |
            /tmp/g006/residual.json
            /tmp/g006/nllb-draft.json
            /tmp/g006/view.json
          if-no-files-found: error
          retention-days: 2
