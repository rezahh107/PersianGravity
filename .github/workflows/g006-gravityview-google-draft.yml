name: G-006 GravityView Google draft

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download locked GravityView census
        uses: actions/download-artifact@v4
        with:
          name: g006-gravityview-census
          path: /tmp/g006/out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36224261125

      - name: Load exact-match historical Persian translation memory
        run: |
          set -euo pipefail
          python3 -m pip install --quiet polib==1.2.0
          curl -fsSL \
            'https://raw.githubusercontent.com/OscarCampohermoso/Proyectos-Web-PHP-MariaDB/f07be38488f3ec64f3ce1e80e00444e2aedb7b56/htdocs-xampp/wordpress/wp-content/plugins/gravityview/languages/gravityview-fa_IR.po' \
            -o /tmp/g006/out/historical-gravityview-2.15-fa_IR.po
          python3 - <<'PY'
          import hashlib, json, polib
          from pathlib import Path
          US='\x1f'
          memory={}
          for entry in polib.pofile('/tmp/g006/out/historical-gravityview-2.15-fa_IR.po'):
              if not entry.msgid or 'fuzzy' in entry.flags:
                  continue
              values=list(entry.msgstr_plural.values()) if entry.msgid_plural else [entry.msgstr]
              if not values or not all(isinstance(v,str) and v.strip() for v in values):
                  continue
              identity=hashlib.sha256(((entry.msgctxt or '')+US+entry.msgid+US+(entry.msgid_plural or '')).encode()).hexdigest()
              memory[identity]=values
          Path('/tmp/g006/out/historical-tm.json').write_text(json.dumps({'schema_version':1,'translations':memory},ensure_ascii=False,indent=2)+'\n')
          print('historical_tm_nonempty='+str(len(memory)))
          PY

      - name: Generate Google draft
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          data=json.loads(Path('/tmp/g006/out/residual.json').read_text())
          entries=data['entries']
          historical=json.loads(Path('/tmp/g006/out/historical-tm.json').read_text())['translations']
          protected=re.compile(
              r'(https?://[^\s<>"\']+'
              r'|%(?:\d+\$)?[-+0#\']*(?:\d+|\*)?(?:\.(?:\d+|\*))?[bcdeEfFgGosuxX]'
              r'|\$\{[^{}\r\n]+\}|\{[^{}\r\n]+\}|</?[A-Za-z][^>]*>'
              r'|&#(?:\d+|x[0-9A-Fa-f]+);|\[[A-Za-z][^\]\r\n]*\]'
              r'|Gravity Forms|GravityView|GravityKit(?:\.com)?|WordPress|JavaScript|JSON|HTML|CSS|PHP|REST API|REST|API|URLs?|AJAX|OAuth|SMTP|HTTPS?|UTC|UID|SVG|CSV)'
          )
          natural=re.compile(r'[A-Za-z]')
          segments=[]; segment_index={}; plans={}

          def plan(value):
              if value is None:return None
              parts=protected.split(value); out=[]
              for idx,part in enumerate(parts):
                  if not part: continue
                  if idx%2==1 or not natural.search(part) or re.fullmatch(r'[\s\W_\d]+',part):
                      out.append(('literal',part))
                  else:
                      if part not in segment_index:
                          segment_index[part]=len(segments); segments.append(part)
                      out.append(('segment',segment_index[part]))
              return out

          for e in entries:
              plans[e['identity']]=(plan(e['msgid']),plan(e.get('msgid_plural')))

          def translate_one(item):
              idx,text=item
              url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=fa&dt=t&q='+urllib.parse.quote(text)
              last=None
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          payload=json.loads(resp.read().decode('utf-8'))
                      out=''.join(chunk[0] for chunk in payload[0] if chunk and chunk[0])
                      if out.strip():
                          return idx,out
                      raise RuntimeError('empty translation')
                  except Exception as exc:
                      last=exc; time.sleep(min(8,1.5**attempt))
              raise RuntimeError(f'google translation failed index={idx}: {last}')

          translated=['']*len(segments)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              for done,(idx,out) in enumerate(ex.map(translate_one,enumerate(segments)),1):
                  translated[idx]=out
                  if done%250==0:
                      print(f'drafted {done}/{len(segments)}',flush=True)

          def render(parts):
              if parts is None:return None
              return ''.join(v if k=='literal' else translated[v] for k,v in parts).strip()

          drafts=[]; hits=0
          for e in entries:
              sp,pp=plans[e['identity']]
              generated=[render(sp)]
              if pp is not None: generated.append(render(pp))
              values=historical.get(e['identity'],generated)
              source='HISTORICAL_EXACT_IDENTITY' if e['identity'] in historical else 'GOOGLE_DRAFT'
              if source=='HISTORICAL_EXACT_IDENTITY': hits+=1
              expected=2 if e.get('msgid_plural') is not None else 1
              if len(values)!=expected:
                  values=generated; source='GOOGLE_DRAFT_PLURAL_FALLBACK'
              assert all(isinstance(v,str) and v.strip() for v in values)
              drafts.append({
                  'identity':e['identity'],'msgctxt':e.get('msgctxt'),'msgid':e['msgid'],
                  'msgid_plural':e.get('msgid_plural'),'references':e.get('references',[]),
                  'draft_msgstr':values,'generated_msgstr':generated,'draft_source':source
              })
          assert len(drafts)==2666
          print('historical_exact_identity_hits='+str(hits))
          Path('/tmp/g006/out/draft-google.json').write_text(json.dumps({
              'schema_version':1,'engine':'translate.googleapis.com gtx','status':'DRAFT_ONLY_NOT_ACCEPTED',
              'count':len(drafts),'entries':drafts
          },ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload Google review input
        uses: actions/upload-artifact@v4
        with:
          name: g006-gravityview-google-review-input
          path: |
            /tmp/g006/out/residual.json
            /tmp/g006/out/accepted.json
            /tmp/g006/out/draft-google.json
            /tmp/g006/out/historical-tm.json
          if-no-files-found: error
          retention-days: 7
