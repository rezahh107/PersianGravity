name: PGR transfer finalize

on:
  push:
    branches:
      - feat/gravityflow-classified-content-admission-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v7
        with:
          ref: feat/gravityflow-classified-content-admission-v2
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Finalize exact Gravity Flow admission tree
        shell: bash
        run: bash .pgr-transfer/finalize.sh
