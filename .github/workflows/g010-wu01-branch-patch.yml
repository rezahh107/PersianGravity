name: G010 WU01 Branch Patch

on:
  push:
    branches:
      - build/g010-wu01-gravityflow-package-authority
    paths:
      - '.g010-wu01-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: build/g010-wu01-gravityflow-package-authority
          fetch-depth: 1
      - name: Apply bounded workflow migration
        run: |
          set -euo pipefail
          python3 tools/compatibility/apply-g010-wu01-workflow-patch.py
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/wu008-real-integration.yml' || {
            echo 'Patch helper changed an unexpected path.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/wu008-real-integration.yml
          git commit -m 'ci: source WU008 Gravity Flow package from canonical authority'
          git push origin HEAD:build/g010-wu01-gravityflow-package-authority
