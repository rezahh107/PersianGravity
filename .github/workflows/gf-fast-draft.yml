name: Gravity Forms fast review draft

on:
  push:
    branches:
      - feat/g006-gravityforms-full-persian-coverage

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install draft tooling
        run: python3 -m pip install --quiet gdown==5.2.0 polib==1.2.0 torch==2.8.0 transformers==4.57.1 sentencepiece==0.2.1
      - name: Download exact Gravity Forms package
        shell: bash
        run: |
          set -euo pipefail
          gdown 'https://drive.google.com/uc?id=1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy' -O /tmp/gravityforms.zip
          echo '542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b  /tmp/gravityforms.zip' | sha256sum -c -
          unzip -q /tmp/gravityforms.zip -d /tmp/gf-src
          pot="$(find /tmp/gf-src -type f -path '*/languages/gravityforms.pot' -print -quit)"
          echo 'a4eb120ee9513552004400548c26a568612ace6accdf9fdcd60b8aa4b163bccf  '"$pot" | sha256sum -c -
          printf '%s\n' "$pot" >/tmp/gf-pot
          git show 83f2cbfb5425984ac6545a6075497606efd81508:languages/gravityforms/gravityforms-fa_IR.po >/tmp/legacy.po
      - name: Build legacy-first candidate and translate only missing 922
        shell: bash
        run: |
          cat >/tmp/fast.py <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import polib,torch
          from transformers import AutoTokenizer,AutoModelForSeq2SeqLM
          def hid(e): return hashlib.sha256(((e.msgctxt or '')+'\x1f'+e.msgid+'\x1f'+(e.msgid_plural or '')).encode()).hexdigest()
          pot=polib.pofile(Path('/tmp/gf-pot').read_text().strip()); current=polib.pofile('languages/providers/gravityforms/source/fa_IR.po'); legacy=polib.pofile('/tmp/legacy.po')
          stale='2b64a903d2065499fa0248c6199db150bb7d1a43025d2908e8a66e4af9d4ab92'
          canon=[e for e in pot if e.msgid and hid(e)!=stale]; accepted={hid(e) for e in current if e.msgid}; residual=sorted((e for e in canon if hid(e) not in accepted),key=hid)
          assert len(canon)==4207 and len(accepted)==1759 and len(residual)==2448
          lmap={hid(e):e for e in legacy if e.msgid and 'fuzzy' not in e.flags and e.msgstr and (not e.msgid_plural or e.msgstr_plural.get(0,'') and e.msgstr_plural.get(1,''))}
          protect=re.compile(r'(https?://[^\s<>"\']+|%(?:\d+\$)?[-+0#\' ]*(?:\d+|\*)?(?:\.(?:\d+|\*))?[bcdeEfFgGosuxX]|\$\{[^{}\r\n]+\}|\{[^{}\r\n]+\}|</?[A-Za-z][^>]*>|&#(?:\d+|x[0-9A-Fa-f]+);|`[^`]+`|Gravity Forms|Gravity Flow|GravityView|WordPress|JavaScript|reCAPTCHA|\b(?:API|URL|PHP|CSS|HTML|JSON|REST|AJAX|ID|IDs|SQL|CLI|UTC|GMT)\b)')
          missing=[e for e in residual if hid(e) not in lmap]; assert len(missing)==922
          todo=[]; recipes={}
          for e in missing:
            frec=[]
            for src in [e.msgid]+([e.msgid_plural] if e.msgid_plural else []):
              parts=protect.split(src); recipe=[]
              for p in parts:
                if not p: continue
                if protect.fullmatch(p): recipe.append(('p',p))
                else: recipe.append(('n',len(todo))); todo.append(p)
              frec.append(recipe)
            recipes[hid(e)]=frec
          tok=AutoTokenizer.from_pretrained('facebook/nllb-200-distilled-600M',src_lang='eng_Latn'); model=AutoModelForSeq2SeqLM.from_pretrained('facebook/nllb-200-distilled-600M'); model.eval(); forced=tok.convert_tokens_to_ids('pes_Arab')
          translated=[]
          for i in range(0,len(todo),48):
            batch=todo[i:i+48]; enc=tok(batch,return_tensors='pt',padding=True,truncation=True,max_length=320)
            with torch.inference_mode(): out=model.generate(**enc,forced_bos_token_id=forced,max_new_tokens=320,num_beams=1)
            translated.extend(tok.batch_decode(out,skip_special_tokens=True))
          rows=[]
          for e in residual:
            identity=hid(e); le=lmap.get(identity)
            if le:
              vals=[le.msgstr] if not e.msgid_plural else [le.msgstr_plural[0],le.msgstr_plural[1]]; origin='legacy'
            else:
              vals=[]
              for recipe in recipes[identity]: vals.append(''.join(p if k=='p' else translated[p] for k,p in recipe).strip())
              origin='nllb'
            rows.append({'identity':identity,'msgctxt':e.msgctxt or None,'msgid':e.msgid,'msgid_plural':e.msgid_plural or None,'references':list(e.occurrences),'candidate':vals,'origin':origin})
          Path('/tmp/gf-fast-draft.json').write_text(json.dumps({'entries':rows,'legacy_count':1526,'nllb_count':922},ensure_ascii=False,indent=2)+'\n')
          print('fast draft',len(rows),'natural segments',len(todo))
          PY
          python3 /tmp/fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: gravityforms-fast-draft
          path: /tmp/gf-fast-draft.json
          retention-days: 2
