name: Gravity Flow finalize staging

on:
  push:
    branches:
      - feat/gravityflow-full-persian-coverage

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Reconstruct reviewed Gravity Flow payload
        shell: bash
        run: |
          set -euo pipefail
          cat .flow-bootstrap/finalpart-* | base64 -d > /tmp/flow-mini-final.tar.xz
          echo '3dc74f43f83d1d859337c1c859851828dabd3528ac3ad34269a0ed8cec269ecf  /tmp/flow-mini-final.tar.xz' | sha256sum -c -
          mkdir -p /tmp/flow-tools /tmp/flow-data /tmp/flow-src
          tar -xJf /tmp/flow-mini-final.tar.xz -C /tmp/flow-tools
          git apply /tmp/flow-tools/flow-code.patch
          git apply .flow-bootstrap/runtime-test.patch
          git apply .flow-bootstrap/phpunit-full-flow.patch

      - name: Download and verify exact Gravity Flow 3.1.0 source package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown==5.2.0
          gdown 'https://drive.google.com/uc?id=1Y90nvrxEEfVZqpmxXkQvwJfw4pvKCoPf' -O /tmp/gravityflow.zip
          echo 'ac0573b75831380417a21a455176e25eb746d718bbbd0bb70d6da6f48cba5404  /tmp/gravityflow.zip' | sha256sum -c -
          unzip -q /tmp/gravityflow.zip -d /tmp/flow-src
          mapfile -t pots < <(find /tmp/flow-src -type f -path '*/languages/gravityflow.pot')
          test "${#pots[@]}" -eq 1
          echo '09a66357bb86fa4b425c2905a6c3417b057da18a9d423d934aa4c544be306961  '"${pots[0]}" | sha256sum -c -
          printf '%s\n' "${pots[0]}" > /tmp/gravityflow-pot-path

      - name: Generate exact reviewed 1098/1098 Gravity Flow authority
        shell: bash
        run: |
          set -euo pipefail
          pot="$(cat /tmp/gravityflow-pot-path)"
          python3 /tmp/flow-tools/prepare_flow_inputs.py "$pot" "$GITHUB_WORKSPACE" /tmp/flow-data
          python3 /tmp/flow-tools/build_flow_translations.py /tmp/flow-data/gravityflow-residual.json /tmp/flow-data/flow_translations.json
          python3 /tmp/flow-tools/generate_flow_files.py "$GITHUB_WORKSPACE" /tmp/flow-data
          php -l tools/i18n/content-admission.php
          php -l tools/i18n/build.php
          php -l tests/CatalogBuildTest.php
          php -l tests/ContentAdmissionGeneralizationTest.php
          php -l tests/CrossProductContentAdmissionIntegrationTest.php
          php -l tests/GravityFlowClassifiedContentAdmissionTest.php
          php -l tests/GravityFlowInboxContentAdmissionTest.php
          php -l tests/GravityFlowStatusContentAdmissionTest.php
          php -l tests/i18n/run-production.php
          git diff --check

      - name: Install repository development dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          sudo apt-get update
          sudo apt-get install --yes gettext

      - name: Rebuild deterministic localization artifacts
        run: composer i18n:build

      - name: WordPress Coding Standards
        run: composer cs

      - name: PHPCompatibility minimum baseline
        run: composer compat

      - name: Structured Scanner pure JavaScript tests
        run: node --test tests/js/structured-scanner.test.js

      - name: Provider catalog integrity and deterministic drift
        run: composer i18n:check

      - name: Check out pinned current WordPress Core
        uses: actions/checkout@v7
        with:
          repository: WordPress/WordPress
          ref: b998fef9238af183f9523b3df71618e6e57498b6
          path: .wordpress-core
          persist-credentials: false

      - name: Current WordPress Core localization contracts
        run: composer i18n:test
        env:
          PGR_WP_CORE: ${{ github.workspace }}/.wordpress-core

      - name: PHPUnit
        run: composer test

      - name: Verify Gravity Flow full state and review closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          meta=json.loads((root/'languages/providers/gravityflow/metadata.json').read_text())
          review=json.loads((root/'tools/i18n/admission/reviews/gravityflow-remainder.json').read_text())
          prov=json.loads((root/'languages/providers/gravityflow/source/provenance.json').read_text())
          assert meta['provenance']['content_admission_state']=='CONTENT_ADMITTED_FULL'
          assert meta['authoritative_total']==1098
          assert meta['counts_in_committed_po']['translated']==1098
          assert meta['counts_in_committed_po']['untranslated']==0
          assert meta['counts_in_committed_po']['fuzzy']==0
          assert float(meta['coverage_percent'])==100.0
          assert meta['content_status']=='FULL_TRANSLATION_CONTENT_ACCEPTED'
          assert prov['content_admission_state']=='CONTENT_ADMITTED_FULL'
          assert prov['content_aggregate']['admitted_message_count']==1098
          assert review['accepted_count']==366
          assert review['unreviewed_count']==0
          assert review['rejected_count']==0
          assert review['semantic_review_passes']==2
          assert review['second_pass_corrections']==34
          assert len(review['entries'])==366
          assert all(e['status']=='ACCEPTED' for e in review['entries'])
          print('Gravity Flow full-state closure PASS: 1098/1098, residual 366 accepted')
          PY

      - name: Remove staging-only files and enforce focused final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wordpress-core .flow-bootstrap
          rm -f .github/workflows/gravityflow-finalize.yml
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected={
            'docs/LOCALIZATION.md',
            'docs/VALIDATION.md',
            'languages/providers/gravityflow/gravityflow-fa_IR.l10n.php',
            'languages/providers/gravityflow/gravityflow-fa_IR.mo',
            'languages/providers/gravityflow/metadata.json',
            'languages/providers/gravityflow/source/fa_IR.po',
            'languages/providers/gravityflow/source/provenance.json',
            'languages/providers/gravityflow/source/records/remainder-fa_IR.po',
            'tests/CatalogBuildTest.php',
            'tests/ContentAdmissionGeneralizationTest.php',
            'tests/CrossProductContentAdmissionIntegrationTest.php',
            'tests/GravityFlowClassifiedContentAdmissionTest.php',
            'tests/GravityFlowInboxContentAdmissionTest.php',
            'tests/GravityFlowStatusContentAdmissionTest.php',
            'tests/i18n/run-production.php',
            'tools/i18n/admission/content.json',
            'tools/i18n/admission/remainders/gravityflow.json',
            'tools/i18n/admission/reviews/gravityflow-remainder.json',
            'tools/i18n/build.php',
            'tools/i18n/content-admission.php',
          }
          out=subprocess.check_output(['git','diff','--name-only','0ce9701deeba2e660ec89c945b0e1519e36b3481','--'],text=True)
          actual={line for line in out.splitlines() if line}
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True)
          actual.update(line for line in untracked.splitlines() if line)
          if actual != expected:
              raise SystemExit('final diff scope mismatch\nmissing='+repr(sorted(expected-actual))+'\nunexpected='+repr(sorted(actual-expected)))
          print('Focused final diff PASS:', len(actual), 'files')
          PY

      - name: Commit verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(i18n): complete Gravity Flow Persian coverage'
          git push origin HEAD:feat/gravityflow-full-persian-coverage
