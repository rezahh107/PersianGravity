name: G011 Exact GF Confirmation Host Contract

on:
  push:
    branches: [feat/g011-confirmation-date-merge-tags]
    paths:
      - '.github/workflows/g011-host-contract.yml'
      - 'tests/real-integration/g011-*'
      - 'includes/class-pgr-gf-confirmation-date-adapter.php'
      - 'includes/class-pgr-core.php'
      - 'persian-gravityforms.php'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g011-host-contract.yml'
      - 'tests/real-integration/g011-*'
      - 'includes/class-pgr-gf-confirmation-date-adapter.php'
      - 'includes/class-pgr-core.php'
      - 'persian-gravityforms.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gf-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ROOT_PASSWORD: g011-root
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pg011-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      G011_WP_PATH: /tmp/g011-wp
      G011_PACKAGE_DIR: /tmp/g011-packages
      G011_ARTIFACT_DIR: /tmp/g011-artifacts
      G011_GF_FILE_ID: 1mnCxBZVDL5qBALXh9CvxEMwIwg-YASCy
      G011_GF_FILE: gravityforms-3.1.1.1-source-package.zip
      G011_GF_SIZE: '5300290'
      G011_GF_SHA256: 542f56ae0747f3661d1474996527298027db3fb8ed3e6469a6391aaabf61069b
      G011_GF_VERSION: 3.1.1.1
      G011_WP_CLI: /tmp/wp-cli.phar
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare isolated paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          mkdir -p "$G011_WP_PATH" "$G011_PACKAGE_DIR" "$G011_ARTIFACT_DIR"
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "G011_ADMIN_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
      - name: Source probe syntax
        run: php -l tests/real-integration/g011-host-source-inventory.php
      - name: Install disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 -o "$G011_WP_CLI" https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $G011_WP_CLI" | sha256sum -c -
          php "$G011_WP_CLI" core download --path="$G011_WP_PATH" --version=6.8.3 --force --skip-content
          php "$G011_WP_CLI" config create --path="$G011_WP_PATH" --dbname=wordpress --dbuser=root --dbpass=g011-root --dbhost=127.0.0.1:3306 --skip-check
          php "$G011_WP_CLI" core install --path="$G011_WP_PATH" --url=http://127.0.0.1:8080 --title='G011 Host Probe' --admin_user=runtime_admin --admin_password="$G011_ADMIN_PASSWORD" --admin_email='runtime@example.invalid' --skip-email
          php "$G011_WP_CLI" config set WP_HOME "http://127.0.0.1:8080" --path="$G011_WP_PATH"
          php "$G011_WP_CLI" config set WP_SITEURL "http://127.0.0.1:8080" --path="$G011_WP_PATH"
          test "$(php "$G011_WP_CLI" --path="$G011_WP_PATH" eval 'echo home_url();')" = "http://127.0.0.1:8080"
          php "$G011_WP_CLI" language core install fa_IR --activate --path="$G011_WP_PATH"
      - name: Download and verify licensed exact Gravity Forms package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --retry-max-time 60 --retry-connrefused --connect-timeout 20 --max-time 180 -o "$G011_PACKAGE_DIR/$G011_GF_FILE" "https://drive.usercontent.google.com/download?id=$G011_GF_FILE_ID&export=download&confirm=t"
          tests/real-integration/verify-package.sh "Gravity Forms" "$G011_GF_FILE_ID" "$G011_PACKAGE_DIR/$G011_GF_FILE" "$G011_GF_FILE" "$G011_GF_SIZE" "$G011_GF_SHA256" "gravityforms/gravityforms.php" "$G011_GF_VERSION" "$G011_ARTIFACT_DIR/package-verification.jsonl"
          unzip -q "$G011_PACKAGE_DIR/$G011_GF_FILE" -d "$G011_WP_PATH/wp-content/plugins"
          php "$G011_WP_CLI" plugin activate gravityforms --path="$G011_WP_PATH"
          test "$(php "$G011_WP_CLI" plugin get gravityforms --field=version --path="$G011_WP_PATH")" = "$G011_GF_VERSION"
      - name: Inspect exact licensed confirmation call graph without leaking vendor source
        shell: bash
        run: |
          set -euo pipefail
          G011_ARTIFACT_DIR="$G011_ARTIFACT_DIR" php "$G011_WP_CLI" --path="$G011_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/real-integration/g011-host-source-inventory.php" --use-include
          test -s "$G011_ARTIFACT_DIR/host-source-inventory.json"
      - name: Characterize actual native confirmation and merge-tag filter scope
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/real-integration/g011-host-runtime-characterization.php
          G011_ARTIFACT_DIR="$G011_ARTIFACT_DIR" php "$G011_WP_CLI" --path="$G011_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/real-integration/g011-host-runtime-characterization.php" --use-include
          test -s "$G011_ARTIFACT_DIR/host-runtime-characterization.json"
      - name: Activate tested PersianGravity with only Jalali presentation
        shell: bash
        run: |
          set -euo pipefail
          expected_pgr_version="$(php tools/release/release-tool.php current)"
          pgr="$G011_WP_PATH/wp-content/plugins/persian-gravityforms"
          mkdir -p "$pgr"
          tar --exclude=.git -cf - . | tar -xf - -C "$pgr"
          php "$G011_WP_CLI" option update pgr_modules '{"schema_version":1,"states":{"national_id":false,"jalali_date":false,"jalali_presentation":true,"iranian_address":false,"digit_normalization":false,"iranian_currency":false,"structured_scanner":false}}' --format=json --path="$G011_WP_PATH"
          php "$G011_WP_CLI" plugin activate persian-gravityforms --path="$G011_WP_PATH"
          test "$(php "$G011_WP_CLI" plugin get persian-gravityforms --field=version --path="$G011_WP_PATH")" = "$expected_pgr_version"
      - name: Verify enabled adapter with real configured ordinary/AJAX Text confirmations
        shell: bash
        run: |
          set -euo pipefail
          php -l includes/class-pgr-gf-confirmation-date-adapter.php
          php -l tests/real-integration/g011-confirmation-runtime.php
          G011_ARTIFACT_DIR="$G011_ARTIFACT_DIR" php "$G011_WP_CLI" --path="$G011_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/real-integration/g011-confirmation-runtime.php" --use-include
          test -s "$G011_ARTIFACT_DIR/g011-enabled-runtime.json"
      - name: Prepare live ordinary/AJAX frontend fixtures
        shell: bash
        run: |
          set -euo pipefail
          G011_ARTIFACT_DIR="$G011_ARTIFACT_DIR" php "$G011_WP_CLI" --path="$G011_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/real-integration/g011-browser-setup.php" --use-include
          test -s "$G011_ARTIFACT_DIR/g011-browser-fixture.json"
      - name: Set up exact Node browser toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install exact Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/real-integration/g011-browser.mjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "if (require('playwright/package.json').version !== '1.55.0') process.exit(1)"
      - name: Start isolated HTTP server
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$G011_WP_PATH" >"$G011_ARTIFACT_DIR/wp-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/wp-login.php > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$G011_ARTIFACT_DIR/wp-server.log"
          exit 1
      - name: Exercise actual ordinary and AJAX confirmations in Chromium
        shell: bash
        run: |
          set -euo pipefail
          node tests/real-integration/g011-browser.mjs
          test -s "$G011_ARTIFACT_DIR/g011-browser-results.json"
      - name: Upload bounded source inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g011-source-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/g011-artifacts/
          if-no-files-found: ignore
          retention-days: 30
