name: Gravity Forms historical translation memory

on:
  push:
    branches:
      - feat/g006-gravityforms-full-persian-coverage

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 83f2cbfb5425984ac6545a6075497606efd81508
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and stage historical PO
        shell: bash
        run: |
          set -euo pipefail
          test -f languages/gravityforms/gravityforms-fa_IR.po
          cp languages/gravityforms/gravityforms-fa_IR.po /tmp/legacy-gravityforms-fa_IR.po
          sha256sum /tmp/legacy-gravityforms-fa_IR.po
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-gravityforms-po
          path: /tmp/legacy-gravityforms-fa_IR.po
          retention-days: 1
