name: PR19 Semantic Repair

on:
  push:
    branches:
      - feat/wu004-gravityforms-classified-admission

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: feat/wu004-gravityforms-classified-admission
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Execute fail-closed repair and verification
        run: bash .github/wu004-run-semantic-repair.sh
