name: G010 WU02 Branch Patch

on:
  push:
    branches:
      - feat/g010-wu02-compatibility-diagnostics
    paths:
      - '.g010-wu02-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/g010-wu02-compatibility-diagnostics
          fetch-depth: 1
      - name: Apply bounded diagnostics documentation patch
        shell: bash
        run: |
          set -euo pipefail
          php tools/compatibility/apply-g010-wu02-admin-patch.php
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'AGENTS.md\ndocs/ARCHITECTURE.md\ntests/GravityFlowCompatibilityDiagnosticsTest.php'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/ARCHITECTURE.md tests/GravityFlowCompatibilityDiagnosticsTest.php
          git commit -m 'docs: define Gravity Flow diagnostics authority boundary'
          git push origin HEAD:feat/g010-wu02-compatibility-diagnostics
